<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Poporinq Island</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a0a; }
canvas { display: block; }

/* HUD overlay — always on top, always in screen pixels */
#hud {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 10;
  font-family: Arial, sans-serif;
  -webkit-text-stroke: 0;
}
#hud-top {
  position: absolute; top: 3%; left: 2%;
  color: #fff; text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
}
#hud-top .row { font-size: 4vmin; line-height: 1.5; }
#hud-top .lvl { font-size: 3vmin; color: #ffdd44; margin-top: 2px; }
.bar-wrap { width: 19vw; height: 0.8vmin; background: #111; border-radius: 2px; margin: 1px 0; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 0.15s; }
#hp-fill  { background: #44ff44; }
#xp-fill  { background: #ffdd00; }

#gear-strip {
  position: absolute; bottom: 0; left: 0; width: 100%;
  background: rgba(0,0,0,0.55);
  display: flex; justify-content: space-around; align-items: center;
  padding: 1.5vmin 0;
  pointer-events: none;
}
.gear-slot {
  font-size: 3vmin; color: #556655;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
  text-align: center; min-width: 18%;
}
.gear-slot.active { color: #ffdd44; }

#boss-bar {
  position: absolute; bottom: 14%; left: 20%; width: 60%;
  display: none;
}
#boss-label {
  text-align: center; color: #ff4444; font-size: 3vmin; font-weight: bold;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000; margin-bottom: 3px;
}
#boss-fill { background: #ff2222; width: 100%; }

#msg {
  position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
  font-size: 6vmin; font-weight: bold; color: #ffdd44;
  text-shadow: -2px -2px 0 #000, 2px 2px 0 #000;
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.3s; text-align: center;
}
#msg-sub {
  position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
  font-size: 3.5vmin; font-weight: normal; color: #aaddff;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.3s; text-align: center;
}

#levelup-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; pointer-events: auto;
}
#levelup-overlay h2 { font-size: 7vmin; color: #ffdd44; margin-bottom: 1vmin; text-shadow: 0 0 10px #ffaa00; }
#levelup-overlay p  { font-size: 3vmin; color: #fff; margin-bottom: 3vmin; }
#levelup-cards { display: flex; gap: 2vmin; flex-wrap: wrap; justify-content: center; max-width: 95vw; }
.lcard {
  width: 26vw; min-width: 80px; max-width: 160px; padding: 2.5vmin 2vmin;
  background: #1a2a3a; border: 2px solid #4488ff; border-radius: 10px;
  cursor: pointer; text-align: center; transition: background 0.15s, border-color 0.15s;
  pointer-events: auto; box-sizing: border-box;
}
.lcard:hover { background: #2a4a6a; border-color: #88bbff; }
.lcard .cn { font-size: min(4vmin, 16px); color: #ffdd44; font-weight: bold; margin-bottom: 1vmin; word-break: break-word; }
.lcard .cd { font-size: min(3vmin, 13px); color: #aaddff; word-break: break-word; }

#gameover-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; pointer-events: auto;
}
#gameover-overlay h1 { font-size: 10vmin; color: #ff4444; margin-bottom: 2vmin; }
#gameover-overlay .stat { font-size: 4vmin; color: #fff; margin: 0.5vmin; }
#gameover-overlay .gear { font-size: 3.5vmin; color: #ffdd44; margin: 1.5vmin; }
#restart-btn {
  margin-top: 3vmin; padding: 2vmin 5vmin;
  font-size: 4vmin; font-weight: bold; color: #44ff88;
  background: #1a3a1a; border: 2px solid #44ff88; border-radius: 8px;
  cursor: pointer;
}
#restart-btn:hover { color: #88ffaa; border-color: #88ffaa; }

#relic-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 25; pointer-events: auto;
}
.relic-card {
  min-width: 55vw; max-width: 85vw; padding: 4vmin 5vmin;
  border-radius: 12px; border-width: 3px; border-style: solid;
  text-align: center; position: relative;
  animation: relicPop 0.3s ease-out;
}
@keyframes relicPop {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.relic-quality { font-size: 3vmin; font-weight: bold; letter-spacing: 2px; margin-bottom: 1.5vmin; text-transform: uppercase; }
.relic-name    { font-size: 6vmin; font-weight: bold; margin-bottom: 1vmin; color: #fff; text-shadow: 0 0 12px currentColor; }
.relic-flavor  { font-size: 2.8vmin; color: #ccc; margin-bottom: 3vmin; font-style: italic; }
.relic-btn {
  padding: 1.5vmin 5vmin; font-size: 3.5vmin; font-weight: bold;
  border-radius: 8px; border: 2px solid; cursor: pointer;
  background: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<!-- HTML HUD — works on any resolution -->
<div id="hud">
  <div id="hud-top">
    <div class="row" id="h-kills">Kills: 0</div>
    <div class="row" id="h-hp">HP: 100</div>
    <div class="bar-wrap"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
    <div class="row" id="h-wave">Wave 1</div>
    <div class="lvl" id="h-lvl">LVL 1</div>
    <div class="bar-wrap"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
  </div>

  <div id="gear-strip">
    <div class="gear-slot" id="g-helm">HLM</div>
    <div class="gear-slot" id="g-sword">SWD</div>
    <div class="gear-slot" id="g-armor">ARM</div>
    <div class="gear-slot" id="g-gloves">GLV</div>
    <div class="gear-slot" id="g-boots">BOT</div>
  </div>

  <div id="boss-bar">
    <div id="boss-label">BOSS</div>
    <div class="bar-wrap" style="width:100%;height:2vmin">
      <div class="bar-fill" id="boss-fill" style="width:100%"></div>
    </div>
  </div>

  <div id="msg" style="opacity:0"></div>
  <div id="msg-sub" style="opacity:0"></div>
</div>

<!-- Level up overlay -->
<div id="levelup-overlay">
  <h2>LEVEL UP!</h2>
  <p>Choose upgrade:</p>
  <div id="levelup-cards"></div>
</div>

<!-- Relic overlay -->
<div id="relic-overlay">
  <div class="relic-card" id="relic-card">
    <div class="relic-quality" id="relic-quality"></div>
    <div class="relic-name" id="relic-name"></div>
    <div class="relic-flavor" id="relic-flavor"></div>
    <button class="relic-btn" id="relic-btn" onclick="window._relicClose && window._relicClose()">Забрать</button>
  </div>
</div>

<!-- Game over overlay -->
<div id="gameover-overlay">
  <h1>GAME OVER</h1>
  <div class="stat" id="go-kills"></div>
  <div class="stat" id="go-wave"></div>
  <div class="stat" id="go-level"></div>
  <div class="gear" id="go-gear"></div>
  <button id="restart-btn" onclick="location.reload()">[ RESTART ]</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
// --- CONSTANTS ---
const ARENA_W = 1200;
const ARENA_H = 1200;
const PLAYER_SPEED = 200;
const POP_SPEED = 80;
const ATTACK_RADIUS = 69;
let ATTACK_RADIUS_MULT = 1.0;
const ATTACK_INTERVAL = 1500;
const POP_DAMAGE = 10;
const POP_DAMAGE_COOLDOWN = 1000;
const XP_PER_POP = 10;
const XP_PER_BOSS = 100;
const BASE_XP = 50;
const WAVE_COUNTS = [10, 15, 20, 25, 30];

// ==================== RELICS ====================
const RELICS = {
  common: {
    label: 'Common', color: '#aaaaaa', bg: '#1a1a1a', chance: 0.60,
    items: [
      'Ржавый гвоздь', 'Мятая фляжка', 'Обломок щита', 'Треснутая пряжка',
      'Щепка от весла', 'Горсть островного песка', 'Потёртый камень',
      'Лоскут знамени', 'Сломанная стрела', 'Кусок старой верёвки'
    ]
  },
  uncommon: {
    label: 'Uncommon', color: '#1eff00', bg: '#0a1f0a', chance: 0.25,
    items: [
      'Зуб Попоринга', 'Склизкий шарик', 'Перо морской птицы', 'Осколок доспеха',
      'Медная монета острова', 'Засушенный коралл', 'Кожаный ремешок рыцаря',
      'Морская ракушка-свисток', 'Засмолённый комок', 'Рог маленького Попоринга'
    ]
  },
  rare: {
    label: 'Rare', color: '#0070dd', bg: '#0a0a20', chance: 0.10,
    items: [
      'Глаз Попоринга', 'Синяя жемчужина', 'Осколок меча предка',
      'Перчатка утонувшего рыцаря', 'Склянка с туманом острова',
      'Зачарованный булыжник', 'Карта неизведанной части острова',
      'Клешня краба-стражника', 'Серебряная монета со странным знаком',
      'Фрагмент старинной брони'
    ]
  },
  epic: {
    label: 'Epic', color: '#a335ee', bg: '#150a20', chance: 0.049,
    items: [
      'Сердце Мини-Попоринга', 'Пурпурный кристалл острова', 'Кулон королевы Попорингов',
      'Обломок трона', 'Призрачное лезвие', 'Тёмная жемчужина бездны',
      'Печать Острова', 'Реликвия забытого ордена', 'Рог Босс-Попоринга',
      'Амулет проклятого рыцаря'
    ]
  },
  legendary: {
    label: 'Legendary', color: '#ff8000', bg: '#1f0a00', chance: 0.001,
    items: [
      'Сердце Попоринга', 'Вечный клинок острова', 'Корона Острова',
      'Слеза Попоринг-бога', 'Душа первого Попоринга', 'Золотой зуб Великого Босса',
      'Пламя Острова', 'Последний рыцарь', 'Реликвия Безымянного',
      'Ядро Попоринг-Матери'
    ]
  }
};

const RELIC_ORDER = ['legendary', 'epic', 'rare', 'uncommon', 'common'];

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  preload() {
    this.load.spritesheet('knight', 'assets/knight.png', { frameWidth: 48, frameHeight: 48 });
    this.load.spritesheet('pop',    'assets/slime_tiny.png', { frameWidth: 24, frameHeight: 24 });
    this.load.spritesheet('boss',   'assets/slime_big.png',  { frameWidth: 48, frameHeight: 48 });
  }

  create() {
    // --- ARENA ---
    const arena = this.add.graphics();
    arena.fillStyle(0x2d5a2d); arena.fillRect(0, 0, ARENA_W, ARENA_H);
    arena.lineStyle(8, 0x1a1a1a); arena.strokeRect(0, 0, ARENA_W, ARENA_H);
    arena.lineStyle(1, 0x3a6a3a, 0.3);
    for (let x = 0; x <= ARENA_W; x += 100) arena.lineBetween(x, 0, x, ARENA_H);
    for (let y = 0; y <= ARENA_H; y += 100) arena.lineBetween(0, y, ARENA_W, y);

    // --- ANIMATIONS ---
    // Knight: 48x48, 6 cols x 24 rows
    // Rows: 0-1=idle down/up, 2-3=idle left/right, 4-5=walk down/up, 6-7=walk left/right
    // 8-11=hurt, 12-15=death, 16-19=attack down/up/left/right, 20-23=special
    const C = 6; // columns per row
    const anims = [
      { key: 'knight-idle-down',   start: 0*C, end: 0*C+5 },
      { key: 'knight-idle-up',     start: 1*C, end: 1*C+5 },
      { key: 'knight-idle-left',   start: 2*C, end: 2*C+5 },
      { key: 'knight-idle-right',  start: 3*C, end: 3*C+5 },
      { key: 'knight-walk-down',   start: 4*C, end: 4*C+5 },
      { key: 'knight-walk-up',     start: 5*C, end: 5*C+5 },
      { key: 'knight-walk-left',   start: 6*C, end: 6*C+5 },
      { key: 'knight-walk-right',  start: 7*C, end: 7*C+5 },
      { key: 'knight-hurt-down',   start: 8*C,  end: 8*C+5 },
      { key: 'knight-hurt-left',   start: 10*C, end: 10*C+5 },
      { key: 'knight-attack-down', start: 16*C, end: 16*C+5 },
      { key: 'knight-attack-up',   start: 17*C, end: 17*C+5 },
      { key: 'knight-attack-left', start: 18*C, end: 18*C+5 },
      { key: 'knight-attack-right',start: 19*C, end: 19*C+5 },
    ];
    anims.forEach(a => {
      this.anims.create({ key: a.key, frames: this.anims.generateFrameNumbers('knight', { start: a.start, end: a.end }), frameRate: 8, repeat: a.key.includes('idle')||a.key.includes('walk') ? -1 : 0 });
    });

    // Pop (tiny slime): 48x48, 5 cols x 3 rows
    // Row 0: idle (5f), Row 1: walk/hop (5f), Row 2: attack/jump (5f)
    this.anims.create({ key: 'pop-idle',   frames: this.anims.generateFrameNumbers('pop', { start: 0, end: 4 }),  frameRate: 6, repeat: -1 });
    this.anims.create({ key: 'pop-walk',   frames: this.anims.generateFrameNumbers('pop', { start: 5, end: 9 }),  frameRate: 8, repeat: -1 });
    this.anims.create({ key: 'pop-attack', frames: this.anims.generateFrameNumbers('pop', { start: 10, end: 14 }), frameRate: 10, repeat: 0 });

    // Boss (big slime): 48x48, 10 cols x 9 rows
    // Row 0: idle (10f), Row 1: walk (10f), Row 2: walk2 (10f), Row 5: attack (10f)
    this.anims.create({ key: 'boss-idle',   frames: this.anims.generateFrameNumbers('boss', { start: 0,  end: 9 }),  frameRate: 6, repeat: -1 });
    this.anims.create({ key: 'boss-walk',   frames: this.anims.generateFrameNumbers('boss', { start: 10, end: 19 }), frameRate: 8, repeat: -1 });
    this.anims.create({ key: 'boss-attack', frames: this.anims.generateFrameNumbers('boss', { start: 50, end: 59 }), frameRate: 10, repeat: 0 });

    // --- PLAYER ---
    this.player = this.add.sprite(ARENA_W / 2, ARENA_H / 2, 'knight').setOrigin(0.5).setDepth(5).setScale(2.5);
    this.player.play('knight-idle-down');
    this.player.facing = 'down';
    this.player.hp = 100;
    this.player.lastDamageTime = new Map();
    this.player.level = 1;
    this.player.xp = 0;
    this.player.xpToNext = BASE_XP;
    this.player.stats = { damage: 1.0, attackSpeed: 1.0, defense: 0, maxHp: 100, moveSpeed: 1.0, critChance: 0 };
    this.player.gear = { helm: 0, sword: 0, armor: 0, gloves: 0, boots: 0 };

    // --- CAMERA ---
    this.cameras.main.setBounds(0, 0, ARENA_W, ARENA_H);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setZoom(Math.min(this.scale.width, this.scale.height) / 500);

    // --- GROUPS & STATE ---
    this.pops = this.add.group();
    this.collectedRelics = new Set();
    this.waveNum = 0;
    this.waveState = 'spawning';
    this.popToSpawn = 0;
    this.popSpawned = 0;
    this.popOnMapLimit = 5;
    this.killCount = 0;
    this.boss = null;
    this.bossMinions = [];
    this.gameOver = false;
    this.paused = false;

    // --- INPUT ---
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });
    this.joy = { active: false, startX: 0, startY: 0, dx: 0, dy: 0, pid: null };
    this.joyBase = this.add.graphics().setScrollFactor(0).setDepth(10);
    this.joyKnob = this.add.graphics().setScrollFactor(0).setDepth(11);
    this.input.on('pointerdown', p => this.joyDown(p));
    this.input.on('pointermove', p => this.joyMove(p));
    this.input.on('pointerup',   p => this.joyUp(p));

    // --- TIMERS ---
    this.time.addEvent({ delay: ATTACK_INTERVAL, callback: this.autoAttack, callbackScope: this, loop: true });

    // --- HUD ---
    this.createHUD();

    // --- START ---
    this.startWave();
  }

  // ==================== WAVES ====================

  startWave() {
    this.waveNum++;
    const n = WAVE_COUNTS[Math.min(this.waveNum - 1, WAVE_COUNTS.length - 1)]
            + (this.waveNum > WAVE_COUNTS.length ? (this.waveNum - WAVE_COUNTS.length) * 5 : 0);
    this.popToSpawn = n;
    this.popSpawned = 0;
    this.popOnMapLimit = Math.max(1, Math.ceil(n * 0.5));
    this.waveState = 'spawning';
    document.getElementById('h-wave').textContent = 'Wave ' + this.waveNum + ' (' + n + ')';
    this.showMsg('Wave ' + this.waveNum);
    this.fillWave();
  }

  fillWave() {
    if (this.gameOver || this.waveState !== 'spawning') return;
    const alive = this.pops.getChildren().filter(p => p.alive && !p.isBossMinion).length;
    const n = Math.min(this.popOnMapLimit - alive, this.popToSpawn - this.popSpawned);
    for (let i = 0; i < n; i++) { this.popSpawned++; this.spawnPop(); }
  }

  spawnPop(boss = false) {
    const side = Phaser.Math.Between(0, 3);
    const m = 30;
    let x, y;
    if (side === 0)      { x = Phaser.Math.Between(m, ARENA_W - m); y = m; }
    else if (side === 1) { x = ARENA_W - m; y = Phaser.Math.Between(m, ARENA_H - m); }
    else if (side === 2) { x = Phaser.Math.Between(m, ARENA_W - m); y = ARENA_H - m; }
    else                 { x = m; y = Phaser.Math.Between(m, ARENA_H - m); }
    const pop = this.add.sprite(x, y, 'pop').setOrigin(0.5).setDepth(4);
    pop.alive = true; pop.isBossMinion = boss;
    // Scale hp and speed per wave
    const waveScale = this.waveNum - 1;
    pop.maxHp = Math.round(20 * Math.pow(1.2, waveScale)); // +20% hp per wave
    pop.hp = pop.maxHp;
    pop.speed = POP_SPEED * Math.pow(1.05, waveScale);     // +5% speed per wave
    pop.setScale(0);
    pop.play('pop-walk');
    this.pops.add(pop);
    this.tweens.add({ targets: pop, scaleX: 2, scaleY: 2, duration: 200 });
    return pop;
  }

  spawnBoss() {
    this.waveState = 'boss';
    document.getElementById('h-wave').textContent = 'BOSS!';
    this.showMsg('BOSS!');
    const bx = Phaser.Math.Between(200, ARENA_W - 200);
    const by = 80;
    this.boss = this.add.sprite(bx, by, 'boss').setOrigin(0.5).setDepth(6);
    this.boss.hp = 150 + this.waveNum * 30;
    this.boss.maxHp = this.boss.hp;
    this.boss.alive = true;
    this.boss.setScale(0);
    this.boss.play('boss-idle');
    this.tweens.add({ targets: this.boss, scaleX: 1.5, scaleY: 1.5, duration: 400 });
    this.createBossHPBar();
    this.bossMinions = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const m = this.add.sprite(
        Phaser.Math.Clamp(bx + Math.cos(a) * 80, 30, ARENA_W - 30),
        Phaser.Math.Clamp(by + Math.sin(a) * 80, 30, ARENA_H - 30),
        'pop'
      ).setOrigin(0.5).setDepth(4);
      m.alive = true; m.isBossMinion = true; m.setScale(0);
      this.tweens.add({ targets: m, scaleX: 1, scaleY: 1, duration: 300, delay: i * 100 });
      this.pops.add(m);
      this.bossMinions.push(m);
    }
  }

  // ==================== COMBAT ====================

  getNearestTarget() {
    // Returns nearest alive enemy (pop or boss) within or outside radius
    let nearest = null, minD = Infinity;
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, pop.x, pop.y);
      if (d < minD) { minD = d; nearest = pop; }
    }
    if (this.boss && this.boss.alive) {
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
      if (d < minD) { minD = d; nearest = this.boss; }
    }
    return { target: nearest, dist: minD };
  }

  getAttackDir(target) {
    if (!target) return 'down';
    const dx = target.x - this.player.x;
    const dy = target.y - this.player.y;
    if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? 'right' : 'left';
    return dy > 0 ? 'down' : 'up';
  }

  showSlashEffect(angleRad) {
    const r = ATTACK_RADIUS * ATTACK_RADIUS_MULT;
    const px = this.player.x;
    const py = this.player.y;
    const spread = Math.PI * 0.7;

    const g = this.add.graphics().setDepth(8);

    // Outer glow
    g.lineStyle(6, 0xffffff, 0.4);
    g.beginPath();
    g.arc(px, py, r + 4, angleRad - spread/2, angleRad + spread/2, false);
    g.strokePath();

    // Main slash
    g.lineStyle(3, 0xffee88, 1.0);
    g.beginPath();
    g.arc(px, py, r, angleRad - spread/2, angleRad + spread/2, false);
    g.strokePath();

    // Inner
    g.lineStyle(2, 0xffffff, 0.7);
    g.beginPath();
    g.arc(px, py, r - 8, angleRad - spread/2, angleRad + spread/2, false);
    g.strokePath();

    // Tips
    const a1 = angleRad - spread/2, a2 = angleRad + spread/2;
    g.lineStyle(2, 0xffee88, 0.9);
    g.lineBetween(px + Math.cos(a1)*(r-12), py + Math.sin(a1)*(r-12), px + Math.cos(a1)*(r+8), py + Math.sin(a1)*(r+8));
    g.lineBetween(px + Math.cos(a2)*(r-12), py + Math.sin(a2)*(r-12), px + Math.cos(a2)*(r+8), py + Math.sin(a2)*(r+8));

    this.tweens.add({ targets: g, alpha: 0, duration: 250, ease: 'Power2', onComplete: () => g.destroy() });
  }

  autoAttack() {
    if (this.gameOver || this.paused) return;

    // Find nearest target → determine attack direction
    const { target, dist } = this.getNearestTarget();
    const attackDir = this.getAttackDir(target);

    // Face toward nearest enemy (no separate attack anim — walk/idle continues)
    this.player.facing = attackDir;

    const angleRad = target
      ? Math.atan2(target.y - this.player.y, target.x - this.player.x)
      : Math.PI / 2;
    this.showSlashEffect(angleRad);

    const minionsAlive = this.bossMinions.filter(m => m.alive);
    const bossShielded = this.boss && this.boss.alive && minionsAlive.length > 0;

    // Sector hit check: enemy must be within arc sector (angle ± spread/2) and range +10%
    const HIT_RADIUS = ATTACK_RADIUS * ATTACK_RADIUS_MULT * 1.1;
    const SPREAD = Math.PI * 0.7;
    const inSector = (ex, ey) => {
      const dx = ex - this.player.x, dy = ey - this.player.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > HIT_RADIUS) return false;
      const enemyAngle = Math.atan2(dy, dx);
      let diff = enemyAngle - angleRad;
      // Normalize diff to [-PI, PI]
      while (diff > Math.PI)  diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return Math.abs(diff) <= SPREAD / 2;
    };

    // Splash: hit ALL pops in sector
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      if (inSector(pop.x, pop.y)) this.killPop(pop);
    }

    // Boss: only damageable when all minions are dead
    if (this.boss && this.boss.alive) {
      if (inSector(this.boss.x, this.boss.y)) {
        if (bossShielded) {
          this.tweens.add({ targets: this.boss, alpha: 0.6, duration: 80, yoyo: true });
          this.showDamageNumber(this.boss.x, this.boss.y - 20, 0, '#aaaaaa');
        } else {
          const isCritBoss = this.rollCrit();
          const dmgBoss = this.rollDamage() * (isCritBoss ? 2 : 1);
          this.boss.hp -= dmgBoss;
          this.showDamageNumber(this.boss.x, this.boss.y, dmgBoss, isCritBoss ? '#ff4400' : '#ff8800');
          this.updateBossHPBar();
          this.tweens.add({ targets: this.boss, alpha: 0.4, duration: 100, yoyo: true });
          if (this.boss.hp <= 0) this.killBoss();
        }
      }
    }
  }

  showDamageNumber(x, y, amount, color) {
    color = color || '#ffffff';
    const t = this.add.text(x, y - 10, '-' + Math.round(amount), {
      fontSize: '22px', fill: color, fontFamily: 'Arial Black',
      stroke: '#000000', strokeThickness: 3
    }).setOrigin(0.5).setDepth(15);
    this.tweens.add({
      targets: t, y: y - 60, alpha: 0, duration: 900,
      ease: 'Power2',
      onComplete: () => t.destroy()
    });
  }

  rollCrit() {
    return Math.random() < this.player.stats.critChance;
  }

  rollDamage() {
    // Base damage: 16–25 (random per hit), scaled by stats.damage
    const base = 16 + Math.random() * 9; // 16.0 to 25.0
    return base * this.player.stats.damage;
  }

  killPop(pop) {
    if (!pop.alive) return;
    const isCrit = this.rollCrit();
    const dmg = this.rollDamage() * (isCrit ? 2 : 1);
    pop.hp = (pop.hp || 1) - dmg;
    this.showDamageNumber(pop.x, pop.y, dmg, isCrit ? '#ff4400' : '#ffff44');
    if (pop.hp > 0) return; // still alive

    pop.alive = false;
    this.killCount++;
    document.getElementById('h-kills').textContent = 'Kills: ' + this.killCount;
    this.addXP(XP_PER_POP);
    this.tweens.add({
      targets: pop, scaleX: 0, scaleY: 0, alpha: 0, duration: 200,
      onComplete: () => {
        this.pops.remove(pop, true, true);
        if (this.waveState === 'spawning' && !pop.isBossMinion) {
          this.time.delayedCall(400, () => this.fillWave());
        }
      }
    });
  }

  killBoss() {
    this.boss.alive = false;
    this.killCount++;
    document.getElementById('h-kills').textContent = 'Kills: ' + this.killCount;
    this.destroyBossHPBar();
    this.tweens.add({
      targets: this.boss, scaleX: 0, scaleY: 0, alpha: 0, duration: 400,
      onComplete: () => { if (this.boss) { this.boss.destroy(); this.boss = null; } }
    });
    this.addXP(XP_PER_BOSS);
    this.showMsg('BOSS DEFEATED!');
    this.time.delayedCall(800, () => { if (!this.gameOver) this.dropEnchant(); });
    this.time.delayedCall(1400, () => { if (!this.gameOver) this.dropRelic(); });
    this.waveState = 'intermission';
  }

  // ==================== XP / LEVEL ====================

  addXP(amount) {
    this.player.xp += amount;
    while (this.player.xp >= this.player.xpToNext) {
      this.player.xp -= this.player.xpToNext;
      this.player.level++;
      this.player.xpToNext = BASE_XP * this.player.level;
      document.getElementById('h-lvl').textContent = 'LVL ' + this.player.level;
      // Full heal on level up
      this.player.hp = this.player.stats.maxHp;
      document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
      this.updateHPBar();
      this.showLevelUp();
    }
    this.updateXPBar();
  }

  showLevelUp() {
    this.paused = true;
    const opts = [
      { name: 'POWER',  desc: '+20% damage',    apply: () => { this.player.stats.damage *= 1.2; } },
      { name: 'SPEED',  desc: '-15% atk cd',    apply: () => { this.player.stats.attackSpeed *= 0.85; } },
      { name: 'ARMOR',  desc: '-15% dmg taken', apply: () => { this.player.stats.defense += 1; } },
      { name: 'HEALTH', desc: '+25 max HP',      apply: () => {
        this.player.stats.maxHp += 25;
        this.player.hp = Math.min(this.player.hp + 25, this.player.stats.maxHp);
        document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
        this.updateHPBar();
      }},
      { name: 'MOVE',   desc: '+15% speed',      apply: () => { this.player.stats.moveSpeed *= 1.15; } },
      { name: 'CRIT%',  desc: '+5% crit chance (crit=x2 dmg)', apply: () => { this.player.stats.critChance = Math.min(1.0, this.player.stats.critChance + 0.05); } },
      { name: 'RANGE',  desc: '+5% attack range', apply: () => { ATTACK_RADIUS_MULT = ATTACK_RADIUS_MULT * 1.05; } }
    ];
    const chosen = Phaser.Utils.Array.Shuffle(opts.slice()).slice(0, 3);
    const container = document.getElementById('levelup-cards');
    container.innerHTML = '';
    const scene = this;
    chosen.forEach(card => {
      const div = document.createElement('div');
      div.className = 'lcard';
      div.innerHTML = '<div class="cn">' + card.name + '</div><div class="cd">' + card.desc + '</div>';
      div.onclick = () => {
        card.apply();
        document.getElementById('levelup-overlay').style.display = 'none';
        scene.paused = false;
      };
      container.appendChild(div);
    });
    document.getElementById('levelup-overlay').style.display = 'flex';
  }

  // ==================== GEAR ====================

  dropEnchant() {
    const SLOTS = [
      { key: 'helm',   name: 'HELM',   stat: 'defense',    bonus: 0.5,  desc: '+0.5 defense' },
      { key: 'sword',  name: 'SWORD',  stat: 'damage',     bonus: 0.15, desc: '+15% damage' },
      { key: 'armor',  name: 'ARMOR',  stat: 'defense',    bonus: 0.8,  desc: '+0.8 defense' },
      { key: 'gloves', name: 'GLOVES', stat: 'attackSpeed',bonus: 0.1,  desc: '-10% attack cd' },
      { key: 'boots',  name: 'BOOTS',  stat: 'moveSpeed',  bonus: 0.1,  desc: '+10% move speed' }
    ];
    const slot = SLOTS[Phaser.Math.Between(0, 4)];
    this.player.gear[slot.key]++;
    const lvl = this.player.gear[slot.key];
    if (slot.stat === 'attackSpeed') this.player.stats.attackSpeed = Math.max(0.3, this.player.stats.attackSpeed - slot.bonus);
    else if (slot.stat === 'damage')     this.player.stats.damage    += slot.bonus;
    else if (slot.stat === 'defense')    this.player.stats.defense   += slot.bonus;
    else if (slot.stat === 'moveSpeed')  this.player.stats.moveSpeed += slot.bonus;
    this.updateGearHUD();
    this.showMsg(slot.name + ' +' + lvl, slot.desc);
  }

  dropRelic() {
    // Roll quality
    const roll = Math.random();
    let cumulative = 0;
    let qualityKey = 'common';
    for (const key of RELIC_ORDER) {
      cumulative += RELICS[key].chance;
      if (roll <= cumulative) { qualityKey = key; break; }
    }
    const quality = RELICS[qualityKey];

    // Pick random relic from this quality
    const shuffled = Phaser.Utils.Array.Shuffle(quality.items.slice());
    const pick = shuffled.find(name => !this.collectedRelics.has(name));

    if (!pick) {
      // All relics of this quality already collected
      this.showMsg('Реликвия уже в коллекции', 'Восстановлено здоровье');
      this.player.hp = this.player.stats.maxHp;
      document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
      this.updateHPBar();
      this.time.delayedCall(2800, () => { if (!this.gameOver) this.startWave(); });
      return;
    }

    this.collectedRelics.add(pick);
    this.paused = true;

    // Show relic overlay
    const card = document.getElementById('relic-card');
    card.style.background = quality.bg;
    card.style.borderColor = quality.color;
    card.style.boxShadow = '0 0 24px ' + quality.color + '88';
    document.getElementById('relic-quality').style.color = quality.color;
    document.getElementById('relic-quality').textContent = '✦ ' + quality.label + ' ✦';
    document.getElementById('relic-name').textContent = pick;
    document.getElementById('relic-name').style.textShadow = '0 0 20px ' + quality.color;
    document.getElementById('relic-flavor').textContent = 'Реликвий собрано: ' + this.collectedRelics.size;
    document.getElementById('relic-btn').style.color = quality.color;
    document.getElementById('relic-btn').style.borderColor = quality.color;
    document.getElementById('relic-overlay').style.display = 'flex';

    const scene = this;
    window._relicClose = () => {
      document.getElementById('relic-overlay').style.display = 'none';
      scene.paused = false;
      scene.time.delayedCall(500, () => { if (!scene.gameOver) scene.startWave(); });
    };
  }

  updateGearHUD() {
    const MAP = { helm: 'g-helm', sword: 'g-sword', armor: 'g-armor', gloves: 'g-gloves', boots: 'g-boots' };
    const LBL = { helm: 'HLM', sword: 'SWD', armor: 'ARM', gloves: 'GLV', boots: 'BOT' };
    for (const [key, id] of Object.entries(MAP)) {
      const el = document.getElementById(id);
      if (!el) continue;
      const lvl = this.player.gear[key] || 0;
      el.textContent = LBL[key] + (lvl > 0 ? '+' + lvl : '');
      el.className = 'gear-slot' + (lvl > 0 ? ' active' : '');
    }
  }

  // ==================== HUD (HTML DOM) ====================

  createHUD() {
    // All HUD is HTML — nothing to create in Phaser
  }

  updateHPBar() {
    const pct = Math.max(0, Math.min(1, this.player.hp / this.player.stats.maxHp));
    const el = document.getElementById('hp-fill');
    if (el) {
      el.style.width = (pct * 100) + '%';
      el.style.background = pct > 0.6 ? '#44ff44' : pct > 0.3 ? '#ffaa00' : '#ff3333';
    }
  }

  updateXPBar() {
    const pct = Math.min(1, this.player.xp / this.player.xpToNext);
    const el = document.getElementById('xp-fill');
    if (el) el.style.width = (pct * 100) + '%';
  }

  // ==================== BOSS HP BAR (HTML) ====================

  createBossHPBar() {
    document.getElementById('boss-bar').style.display = 'block';
    document.getElementById('boss-fill').style.width = '100%';
  }

  updateBossHPBar() {
    if (!this.boss) return;
    const pct = Math.max(0, this.boss.hp / this.boss.maxHp);
    document.getElementById('boss-fill').style.width = (pct * 100) + '%';
  }

  destroyBossHPBar() {
    document.getElementById('boss-bar').style.display = 'none';
  }

  // ==================== MESSAGES (HTML) ====================

  showMsg(text, sub) {
    const el = document.getElementById('msg');
    const elSub = document.getElementById('msg-sub');
    if (!el) return;
    el.textContent = text;
    el.style.opacity = '1';
    if (elSub) {
      elSub.textContent = sub || '';
      elSub.style.opacity = sub ? '1' : '0';
    }
    clearTimeout(this._msgTimer);
    this._msgTimer = setTimeout(() => {
      el.style.opacity = '0';
      if (elSub) elSub.style.opacity = '0';
    }, 2500);
  }

  // ==================== GAME OVER (HTML) ====================

  showGameOver() {
    this.gameOver = true;
    const KEYS = ['helm','sword','armor','gloves','boots'];
    const LBL  = ['HLM','SWD','ARM','GLV','BOT'];
    const gs = KEYS.map((k,i) => { const l = this.player.gear[k]||0; return LBL[i]+(l>0?'+'+l:''); }).join('  ');
    document.getElementById('go-kills').textContent  = 'Kills: '  + this.killCount;
    document.getElementById('go-wave').textContent   = 'Wave: '   + this.waveNum;
    document.getElementById('go-level').textContent  = 'Level: '  + this.player.level;
    document.getElementById('go-gear').textContent   = gs;
    document.getElementById('gameover-overlay').style.display = 'flex';
  }

  // ==================== JOYSTICK ====================

  joyDown(p) {
    if (!this.joy.active) {
      this.joy = { active: true, startX: p.x, startY: p.y, dx: 0, dy: 0, pid: p.id };
      this.joyBase.clear();
      this.joyBase.lineStyle(2, 0xffffff, 0.3); this.joyBase.fillStyle(0xffffff, 0.1);
      this.joyBase.fillCircle(p.x, p.y, 50); this.joyBase.strokeCircle(p.x, p.y, 50);
      this.joyKnob.clear(); this.joyKnob.fillStyle(0xffffff, 0.4); this.joyKnob.fillCircle(p.x, p.y, 22);
    }
  }

  joyMove(p) {
    if (!this.joy.active || p.id !== this.joy.pid) return;
    const dx = p.x - this.joy.startX, dy = p.y - this.joy.startY;
    const len = Math.sqrt(dx*dx + dy*dy), r = 50;
    if (len > 0) { this.joy.dx = (dx/len)*Math.min(len,r)/r; this.joy.dy = (dy/len)*Math.min(len,r)/r; }
    const cx = this.joy.startX + this.joy.dx * r, cy = this.joy.startY + this.joy.dy * r;
    this.joyKnob.clear(); this.joyKnob.fillStyle(0xffffff, 0.4); this.joyKnob.fillCircle(cx, cy, 22);
  }

  joyUp(p) {
    if (p.id !== this.joy.pid) return;
    this.joy.active = false; this.joy.dx = 0; this.joy.dy = 0;
    this.joyBase.clear(); this.joyKnob.clear();
  }

  // ==================== UPDATE ====================

  update(time, delta) {
    if (this.gameOver || this.paused) return;
    const dt = delta / 1000;

    // Movement
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown  || this.wasd.left.isDown)  vx = -1;
    else if (this.cursors.right.isDown || this.wasd.right.isDown) vx = 1;
    if (this.cursors.up.isDown    || this.wasd.up.isDown)    vy = -1;
    else if (this.cursors.down.isDown  || this.wasd.down.isDown)  vy = 1;
    if (this.joy.active) { vx = this.joy.dx; vy = this.joy.dy; }
    if (vx && vy) { vx *= 0.707; vy *= 0.707; }
    const spd = PLAYER_SPEED * this.player.stats.moveSpeed;
    this.player.x = Phaser.Math.Clamp(this.player.x + vx * spd * dt, 16, ARENA_W - 16);
    this.player.y = Phaser.Math.Clamp(this.player.y + vy * spd * dt, 16, ARENA_H - 16);

    // Knight walk animation
    if (true) {
      if (vx !== 0 || vy !== 0) {
        let dir = 'down';
        if (Math.abs(vy) >= Math.abs(vx)) { dir = vy > 0 ? 'down' : 'up'; }
        else { dir = vx > 0 ? 'right' : 'left'; }
        if (dir !== this.player.facing || !this.player.anims.isPlaying) {
          this.player.facing = dir;
          this.player.play('knight-walk-' + dir, true);
        }
      } else {
        const idle = 'knight-idle-' + (this.player.facing || 'down');
        if (!this.player.anims.currentAnim || this.player.anims.currentAnim.key !== idle) {
          this.player.play(idle, true);
        }
      }
    }

    // Wave end check
    if (this.waveState === 'spawning' &&
        this.popSpawned >= this.popToSpawn &&
        this.pops.getChildren().filter(p => p.alive && !p.isBossMinion).length === 0) {
      this.waveState = 'boss';
      this.time.delayedCall(1000, () => { if (!this.gameOver) this.spawnBoss(); });
    }

    // Pop movement & damage
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      const dx = this.player.x - pop.x, dy = this.player.y - pop.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 18) {
        pop.x += (dx/dist) * (pop.speed || POP_SPEED) * dt;
        pop.y += (dy/dist) * (pop.speed || POP_SPEED) * dt;
        if (pop.anims.currentAnim && pop.anims.currentAnim.key !== 'pop-walk') pop.play('pop-walk', true);
      } else {
        if (pop.anims.currentAnim && pop.anims.currentAnim.key !== 'pop-attack') pop.play('pop-attack', true);
        const last = this.player.lastDamageTime.get(pop) || 0;
        if (time - last > POP_DAMAGE_COOLDOWN) {
          this.player.lastDamageTime.set(pop, time);
          const dmg = POP_DAMAGE * Math.max(0.1, 1 - this.player.stats.defense * 0.15);
          this.player.hp = Math.max(0, this.player.hp - dmg);
          document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
          this.updateHPBar();
          this.tweens.add({ targets: this.player, alpha: 0.3, duration: 100, yoyo: true });
          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
    }

    // Boss movement & damage
    if (this.boss && this.boss.alive) {
      const dx = this.player.x - this.boss.x, dy = this.player.y - this.boss.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 48) {
        this.boss.x += (dx/dist) * 50 * dt;
        this.boss.y += (dy/dist) * 50 * dt;
        if (this.boss.anims.currentAnim && this.boss.anims.currentAnim.key !== 'boss-walk') this.boss.play('boss-walk', true);
      } else {
        if (this.boss.anims.currentAnim && this.boss.anims.currentAnim.key !== 'boss-attack') this.boss.play('boss-attack', true);
        const last = this.player.lastDamageTime.get(this.boss) || 0;
        if (time - last > 800) {
          this.player.lastDamageTime.set(this.boss, time);
          const dmg = 20 * Math.max(0.1, 1 - this.player.stats.defense * 0.15);
          this.player.hp = Math.max(0, this.player.hp - dmg);
          document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
          this.updateHPBar();
          this.tweens.add({ targets: this.player, alpha: 0.2, duration: 150, yoyo: true });
          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
      // Minions orbit boss
      const alive = this.bossMinions.filter(m => m.alive);
      alive.forEach((m, i) => {
        const a = (i / alive.length) * Math.PI * 2 + time * 0.001;
        m.x = this.boss.x + Math.cos(a) * 70;
        m.y = this.boss.y + Math.sin(a) * 70;
      });
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#0a1a0a',
  scene: GameScene,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
};

new Phaser.Game(config);
</script>
</body>
</html>
