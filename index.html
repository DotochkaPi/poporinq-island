<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Попоринг Айленд</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
const ARENA_W = 1200;
const ARENA_H = 1200;
const PLAYER_SPEED = 200;
const POP_SPEED = 80;
const POP_SPAWN_INTERVAL = 2000;
const POP_MAX = 20;
const ATTACK_RADIUS = 60;
const ATTACK_INTERVAL = 1500;
const POP_DAMAGE = 10;
const POP_DAMAGE_COOLDOWN = 1000;

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  preload() {
    // Генерируем текстуры через Graphics
  }

  create() {
    this.cameras.main.setBackgroundColor('#1a3a1a');

    // Арена
    const arena = this.add.graphics();
    arena.fillStyle(0x2d5a2d, 1);
    arena.fillRect(0, 0, ARENA_W, ARENA_H);
    arena.lineStyle(8, 0x1a1a1a, 1);
    arena.strokeRect(0, 0, ARENA_W, ARENA_H);

    // Сетка для ощущения пространства
    arena.lineStyle(1, 0x3a6a3a, 0.3);
    for (let x = 0; x <= ARENA_W; x += 100) arena.lineBetween(x, 0, x, ARENA_H);
    for (let y = 0; y <= ARENA_H; y += 100) arena.lineBetween(0, y, ARENA_W, y);

    // Рыцарь — текстура
    const knightGfx = this.make.graphics({ x: 0, y: 0, add: false });
    knightGfx.fillStyle(0x4488ff, 1);
    knightGfx.fillRect(0, 0, 32, 32);
    knightGfx.fillStyle(0x88bbff, 1);
    knightGfx.fillRect(8, 4, 16, 10); // голова
    knightGfx.fillStyle(0xffdd44, 1);
    knightGfx.fillRect(13, 0, 6, 6); // корона
    knightGfx.generateTexture('knight', 32, 32);
    knightGfx.destroy();

    // Попоринг — текстура
    const popGfx = this.make.graphics({ x: 0, y: 0, add: false });
    popGfx.fillStyle(0xff4444, 1);
    popGfx.fillCircle(12, 12, 12);
    popGfx.fillStyle(0xff8888, 1);
    popGfx.fillCircle(8, 9, 3);
    popGfx.fillCircle(16, 9, 3);
    popGfx.fillStyle(0x000000, 1);
    popGfx.fillCircle(8, 9, 1.5);
    popGfx.fillCircle(16, 9, 1.5);
    popGfx.generateTexture('pop', 24, 24);
    popGfx.destroy();

    // Игрок
    this.player = this.add.sprite(ARENA_W / 2, ARENA_H / 2, 'knight');
    this.player.setOrigin(0.5, 0.5);
    this.player.hp = 100;
    this.player.lastDamageTime = {};

    // Камера следует за игроком
    this.cameras.main.setBounds(0, 0, ARENA_W, ARENA_H);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setZoom(1.2);

    // Группа Попорингов
    this.pops = this.add.group();
    this.killCount = 0;

    // Управление
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });

    // Виртуальный джойстик (touch)
    this.joystick = { active: false, startX: 0, startY: 0, dx: 0, dy: 0, pointerId: null };
    this.input.on('pointerdown', (p) => {
      if (!this.joystick.active) {
        this.joystick.active = true;
        this.joystick.startX = p.x;
        this.joystick.startY = p.y;
        this.joystick.pointerId = p.id;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
        this.showJoystickGraphic(p.x, p.y);
      }
    });
    this.input.on('pointermove', (p) => {
      if (this.joystick.active && p.id === this.joystick.pointerId) {
        const dx = p.x - this.joystick.startX;
        const dy = p.y - this.joystick.startY;
        const len = Math.sqrt(dx * dx + dy * dy);
        const maxR = 50;
        if (len > 0) {
          this.joystick.dx = (dx / len) * Math.min(len, maxR) / maxR;
          this.joystick.dy = (dy / len) * Math.min(len, maxR) / maxR;
        }
        this.updateJoystickGraphic(p.x, p.y);
      }
    });
    this.input.on('pointerup', (p) => {
      if (p.id === this.joystick.pointerId) {
        this.joystick.active = false;
        this.joystick.dx = 0;
        this.joystick.dy = 0;
        this.hideJoystickGraphic();
      }
    });

    // Джойстик графика
    this.joyBase = this.add.graphics().setScrollFactor(0).setDepth(10);
    this.joyStick = this.add.graphics().setScrollFactor(0).setDepth(11);

    // Таймер спавна
    this.time.addEvent({ delay: POP_SPAWN_INTERVAL, callback: this.spawnPop, callbackScope: this, loop: true });

    // Таймер атаки
    this.time.addEvent({ delay: ATTACK_INTERVAL, callback: this.autoAttack, callbackScope: this, loop: true });

    // HUD
    this.createHUD();

    // Состояние игры
    this.gameOver = false;
    this.gameOverContainer = null;

    // Первый спавн сразу
    for (let i = 0; i < 5; i++) this.spawnPop();
  }

  showJoystickGraphic(x, y) {
    this.joyBase.clear();
    this.joyBase.lineStyle(2, 0xffffff, 0.3);
    this.joyBase.fillStyle(0xffffff, 0.1);
    this.joyBase.fillCircle(x, y, 50);
    this.joyBase.strokeCircle(x, y, 50);
    this.updateJoystickGraphic(x, y);
  }

  updateJoystickGraphic(px, py) {
    this.joyStick.clear();
    this.joyStick.fillStyle(0xffffff, 0.4);
    const cx = this.joystick.startX + this.joystick.dx * 50;
    const cy = this.joystick.startY + this.joystick.dy * 50;
    this.joyStick.fillCircle(cx, cy, 22);
  }

  hideJoystickGraphic() {
    this.joyBase.clear();
    this.joyStick.clear();
  }

  createHUD() {
    const style = { fontSize: '18px', fill: '#ffffff', fontFamily: 'monospace', stroke: '#000000', strokeThickness: 3 };

    this.hudKills = this.add.text(16, 16, '⚔️ 0', style).setScrollFactor(0).setDepth(20);
    this.hudHP = this.add.text(16, 44, '❤️ 100', style).setScrollFactor(0).setDepth(20);
    this.hudWave = this.add.text(16, 72, '🌊 Волна 1', style).setScrollFactor(0).setDepth(20);

    // HP бар
    this.hpBarBg = this.add.graphics().setScrollFactor(0).setDepth(20);
    this.hpBarFill = this.add.graphics().setScrollFactor(0).setDepth(21);
    this.drawHPBar(100);
  }

  drawHPBar(hp) {
    this.hpBarBg.clear();
    this.hpBarBg.fillStyle(0x333333, 0.8);
    this.hpBarBg.fillRect(14, 96, 154, 14);

    this.hpBarFill.clear();
    const pct = hp / 100;
    const color = pct > 0.6 ? 0x44ff44 : pct > 0.3 ? 0xffaa00 : 0xff3333;
    this.hpBarFill.fillStyle(color, 1);
    this.hpBarFill.fillRect(16, 98, 150 * pct, 10);
  }

  spawnPop() {
    if (this.gameOver) return;
    if (this.pops.getLength() >= POP_MAX) return;

    const side = Phaser.Math.Between(0, 3);
    let x, y;
    const margin = 30;
    if (side === 0) { x = Phaser.Math.Between(margin, ARENA_W - margin); y = margin; }
    else if (side === 1) { x = ARENA_W - margin; y = Phaser.Math.Between(margin, ARENA_H - margin); }
    else if (side === 2) { x = Phaser.Math.Between(margin, ARENA_W - margin); y = ARENA_H - margin; }
    else { x = margin; y = Phaser.Math.Between(margin, ARENA_H - margin); }

    const pop = this.add.sprite(x, y, 'pop');
    pop.setOrigin(0.5, 0.5);
    pop.hp = 30;
    pop.alive = true;
    this.pops.add(pop);

    // Появление
    this.tweens.add({ targets: pop, scaleX: 1, scaleY: 1, from: 0, duration: 200 });
  }

  autoAttack() {
    if (this.gameOver) return;
    const pops = this.pops.getChildren();
    if (pops.length === 0) return;

    let nearest = null;
    let minDist = ATTACK_RADIUS;

    for (const pop of pops) {
      if (!pop.alive) continue;
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, pop.x, pop.y);
      if (d < minDist) { minDist = d; nearest = pop; }
    }

    if (nearest) {
      this.killPop(nearest);

      // Визуальный эффект атаки
      const line = this.add.graphics();
      line.lineStyle(2, 0xffff00, 1);
      line.lineBetween(this.player.x, this.player.y, nearest.x, nearest.y);
      this.time.delayedCall(100, () => line.destroy());
    }
  }

  killPop(pop) {
    if (!pop.alive) return;
    pop.alive = false;
    this.killCount++;
    this.hudKills.setText('⚔️ ' + this.killCount);

    this.tweens.add({
      targets: pop, scaleX: 0, scaleY: 0, alpha: 0, duration: 200,
      onComplete: () => { this.pops.remove(pop, true, true); }
    });
  }

  showGameOver() {
    this.gameOver = true;

    const cx = this.cameras.main.width / 2;
    const cy = this.cameras.main.height / 2;

    const bg = this.add.graphics().setScrollFactor(0).setDepth(30);
    bg.fillStyle(0x000000, 0.75);
    bg.fillRect(0, 0, this.cameras.main.width, this.cameras.main.height);

    this.add.text(cx, cy - 60, 'GAME OVER', {
      fontSize: '42px', fill: '#ff4444', fontFamily: 'monospace',
      stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(31);

    this.add.text(cx, cy, '⚔️ Убито: ' + this.killCount, {
      fontSize: '24px', fill: '#ffffff', fontFamily: 'monospace',
      stroke: '#000', strokeThickness: 3
    }).setOrigin(0.5).setScrollFactor(0).setDepth(31);

    const restartBtn = this.add.text(cx, cy + 60, '[ НАЧАТЬ ЗАНОВО ]', {
      fontSize: '22px', fill: '#44ff88', fontFamily: 'monospace',
      stroke: '#000', strokeThickness: 3,
      backgroundColor: '#1a3a1a', padding: { x: 16, y: 8 }
    }).setOrigin(0.5).setScrollFactor(0).setDepth(31).setInteractive();

    restartBtn.on('pointerover', () => restartBtn.setStyle({ fill: '#88ffaa' }));
    restartBtn.on('pointerout', () => restartBtn.setStyle({ fill: '#44ff88' }));
    restartBtn.on('pointerdown', () => this.scene.restart());
  }

  update(time, delta) {
    if (this.gameOver) return;

    const dt = delta / 1000;
    let vx = 0, vy = 0;

    // Клавиатура
    if (this.cursors.left.isDown || this.wasd.left.isDown) vx = -1;
    else if (this.cursors.right.isDown || this.wasd.right.isDown) vx = 1;
    if (this.cursors.up.isDown || this.wasd.up.isDown) vy = -1;
    else if (this.cursors.down.isDown || this.wasd.down.isDown) vy = 1;

    // Джойстик (приоритет если активен)
    if (this.joystick.active) {
      vx = this.joystick.dx;
      vy = this.joystick.dy;
    }

    // Нормализация диагонали
    if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }

    // Движение с ограничением арены
    const hw = 16, hh = 16;
    this.player.x = Phaser.Math.Clamp(this.player.x + vx * PLAYER_SPEED * dt, hw, ARENA_W - hw);
    this.player.y = Phaser.Math.Clamp(this.player.y + vy * PLAYER_SPEED * dt, hh, ARENA_H - hh);

    // Движение Попорингов к игроку + урон
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;

      const dx = this.player.x - pop.x;
      const dy = this.player.y - pop.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 18) {
        pop.x += (dx / dist) * POP_SPEED * dt;
        pop.y += (dy / dist) * POP_SPEED * dt;
      } else {
        // Контакт — урон раз в секунду
        const popId = pop.x + '_' + pop.y;
        const lastHit = this.player.lastDamageTime[pop] || 0;
        if (time - lastHit > POP_DAMAGE_COOLDOWN) {
          this.player.lastDamageTime[pop] = time;
          this.player.hp -= POP_DAMAGE;
          this.player.hp = Math.max(0, this.player.hp);
          this.hudHP.setText('❤️ ' + this.player.hp);
          this.drawHPBar(this.player.hp);

          // Флэш при уроне
          this.tweens.add({ targets: this.player, alpha: 0.3, duration: 100, yoyo: true });

          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#1a1a2e',
  scene: GameScene,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  }
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
