<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Poporinq Island</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a0a; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
// --- CONSTANTS ---
const ARENA_W = 1200;
const ARENA_H = 1200;
const PLAYER_SPEED = 200;
const POP_SPEED = 80;
const ATTACK_RADIUS = 60;
const ATTACK_INTERVAL = 1500;
const POP_DAMAGE = 10;
const POP_DAMAGE_COOLDOWN = 1000;
const XP_PER_POP = 10;
const XP_PER_BOSS = 100;
const BASE_XP = 50;
const WAVE_COUNTS = [10, 15, 20, 25, 30];

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  create() {
    // --- ARENA ---
    const arena = this.add.graphics();
    arena.fillStyle(0x2d5a2d); arena.fillRect(0, 0, ARENA_W, ARENA_H);
    arena.lineStyle(8, 0x1a1a1a); arena.strokeRect(0, 0, ARENA_W, ARENA_H);
    arena.lineStyle(1, 0x3a6a3a, 0.3);
    for (let x = 0; x <= ARENA_W; x += 100) arena.lineBetween(x, 0, x, ARENA_H);
    for (let y = 0; y <= ARENA_H; y += 100) arena.lineBetween(0, y, ARENA_W, y);

    // --- TEXTURES ---
    const kg = this.make.graphics({ x: 0, y: 0, add: false });
    kg.fillStyle(0x4488ff); kg.fillRect(0, 0, 32, 32);
    kg.fillStyle(0x88bbff); kg.fillRect(8, 4, 16, 10);
    kg.fillStyle(0xffdd44); kg.fillRect(13, 0, 6, 6);
    kg.generateTexture('knight', 32, 32); kg.destroy();

    const pg = this.make.graphics({ x: 0, y: 0, add: false });
    pg.fillStyle(0xff4444); pg.fillCircle(12, 12, 12);
    pg.fillStyle(0xff8888); pg.fillCircle(8, 9, 3); pg.fillCircle(16, 9, 3);
    pg.fillStyle(0x000000); pg.fillCircle(8, 9, 1.5); pg.fillCircle(16, 9, 1.5);
    pg.generateTexture('pop', 24, 24); pg.destroy();

    const bg2 = this.make.graphics({ x: 0, y: 0, add: false });
    bg2.fillStyle(0xcc0000); bg2.fillCircle(32, 32, 32);
    bg2.fillStyle(0xff6666); bg2.fillCircle(20, 24, 7); bg2.fillCircle(44, 24, 7);
    bg2.fillStyle(0x000000); bg2.fillCircle(20, 24, 4); bg2.fillCircle(44, 24, 4);
    bg2.fillStyle(0xffdd44);
    bg2.fillTriangle(16, 10, 24, 2, 32, 10);
    bg2.fillTriangle(28, 10, 36, 0, 44, 10);
    bg2.fillTriangle(40, 10, 48, 4, 56, 10);
    bg2.generateTexture('boss', 64, 64); bg2.destroy();

    // --- PLAYER ---
    this.player = this.add.sprite(ARENA_W / 2, ARENA_H / 2, 'knight').setOrigin(0.5).setDepth(5);
    this.player.hp = 100;
    this.player.lastDamageTime = new Map();
    this.player.level = 1;
    this.player.xp = 0;
    this.player.xpToNext = BASE_XP;
    this.player.stats = { damage: 1.0, attackSpeed: 1.0, defense: 0, maxHp: 100, moveSpeed: 1.0 };
    this.player.gear = { helm: 0, sword: 0, armor: 0, gloves: 0, boots: 0 };

    // --- CAMERA ---
    this.cameras.main.setBounds(0, 0, ARENA_W, ARENA_H);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
    this.cameras.main.setZoom(Math.min(this.scale.width, this.scale.height) / 500);

    // --- GROUPS & STATE ---
    this.pops = this.add.group();
    this.waveNum = 0;
    this.waveState = 'spawning';
    this.popToSpawn = 0;
    this.popSpawned = 0;
    this.popOnMapLimit = 5;
    this.killCount = 0;
    this.boss = null;
    this.bossMinions = [];
    this.gameOver = false;
    this.paused = false;

    // --- INPUT ---
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({
      up: Phaser.Input.Keyboard.KeyCodes.W,
      down: Phaser.Input.Keyboard.KeyCodes.S,
      left: Phaser.Input.Keyboard.KeyCodes.A,
      right: Phaser.Input.Keyboard.KeyCodes.D
    });
    this.joy = { active: false, startX: 0, startY: 0, dx: 0, dy: 0, pid: null };
    this.joyBase = this.add.graphics().setScrollFactor(0).setDepth(10);
    this.joyKnob = this.add.graphics().setScrollFactor(0).setDepth(11);
    this.input.on('pointerdown', p => this.joyDown(p));
    this.input.on('pointermove', p => this.joyMove(p));
    this.input.on('pointerup',   p => this.joyUp(p));

    // --- TIMERS ---
    this.time.addEvent({ delay: ATTACK_INTERVAL, callback: this.autoAttack, callbackScope: this, loop: true });

    // --- HUD ---
    this.createHUD();

    // --- START ---
    this.startWave();
  }

  // ==================== WAVES ====================

  startWave() {
    this.waveNum++;
    const n = WAVE_COUNTS[Math.min(this.waveNum - 1, WAVE_COUNTS.length - 1)]
            + (this.waveNum > WAVE_COUNTS.length ? (this.waveNum - WAVE_COUNTS.length) * 5 : 0);
    this.popToSpawn = n;
    this.popSpawned = 0;
    this.popOnMapLimit = Math.max(1, Math.ceil(n * 0.5));
    this.waveState = 'spawning';
    this.hudWave.setText('Wave ' + this.waveNum + ' (' + n + ')');
    this.showMsg('Wave ' + this.waveNum);
    this.fillWave();
  }

  fillWave() {
    if (this.gameOver || this.waveState !== 'spawning') return;
    const alive = this.pops.getChildren().filter(p => p.alive && !p.isBossMinion).length;
    const n = Math.min(this.popOnMapLimit - alive, this.popToSpawn - this.popSpawned);
    for (let i = 0; i < n; i++) { this.popSpawned++; this.spawnPop(); }
  }

  spawnPop(boss = false) {
    const side = Phaser.Math.Between(0, 3);
    const m = 30;
    let x, y;
    if (side === 0)      { x = Phaser.Math.Between(m, ARENA_W - m); y = m; }
    else if (side === 1) { x = ARENA_W - m; y = Phaser.Math.Between(m, ARENA_H - m); }
    else if (side === 2) { x = Phaser.Math.Between(m, ARENA_W - m); y = ARENA_H - m; }
    else                 { x = m; y = Phaser.Math.Between(m, ARENA_H - m); }
    const pop = this.add.sprite(x, y, 'pop').setOrigin(0.5).setDepth(4);
    pop.alive = true; pop.isBossMinion = boss; pop.setScale(0);
    this.pops.add(pop);
    this.tweens.add({ targets: pop, scaleX: 1, scaleY: 1, duration: 200 });
    return pop;
  }

  spawnBoss() {
    this.waveState = 'boss';
    this.hudWave.setText('BOSS!');
    this.showMsg('BOSS!');
    const bx = Phaser.Math.Between(200, ARENA_W - 200);
    const by = 80;
    this.boss = this.add.sprite(bx, by, 'boss').setOrigin(0.5).setDepth(6);
    this.boss.hp = 150 + this.waveNum * 30;
    this.boss.maxHp = this.boss.hp;
    this.boss.alive = true;
    this.boss.setScale(0);
    this.tweens.add({ targets: this.boss, scaleX: 1, scaleY: 1, duration: 400 });
    this.createBossHPBar();
    this.bossMinions = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      const m = this.add.sprite(
        Phaser.Math.Clamp(bx + Math.cos(a) * 80, 30, ARENA_W - 30),
        Phaser.Math.Clamp(by + Math.sin(a) * 80, 30, ARENA_H - 30),
        'pop'
      ).setOrigin(0.5).setDepth(4);
      m.alive = true; m.isBossMinion = true; m.setScale(0);
      this.tweens.add({ targets: m, scaleX: 1, scaleY: 1, duration: 300, delay: i * 100 });
      this.pops.add(m);
      this.bossMinions.push(m);
    }
  }

  // ==================== COMBAT ====================

  autoAttack() {
    if (this.gameOver || this.paused) return;
    const minions = this.bossMinions.filter(m => m.alive);
    if (this.boss && this.boss.alive && minions.length > 0) {
      let nearest = null, minD = ATTACK_RADIUS;
      for (const m of minions) {
        const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, m.x, m.y);
        if (d < minD) { minD = d; nearest = m; }
      }
      if (nearest) this.killPop(nearest);
      return;
    }
    if (this.boss && this.boss.alive) {
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
      if (d < ATTACK_RADIUS + 32) {
        this.boss.hp -= 20 * this.player.stats.damage;
        this.updateBossHPBar();
        this.tweens.add({ targets: this.boss, alpha: 0.4, duration: 100, yoyo: true });
        const line = this.add.graphics().setDepth(7);
        line.lineStyle(3, 0xff8800); line.lineBetween(this.player.x, this.player.y, this.boss.x, this.boss.y);
        this.time.delayedCall(120, () => line.destroy());
        if (this.boss.hp <= 0) this.killBoss();
      }
      return;
    }
    const pops = this.pops.getChildren();
    let nearest = null, minD = ATTACK_RADIUS;
    for (const pop of pops) {
      if (!pop.alive) continue;
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, pop.x, pop.y);
      if (d < minD) { minD = d; nearest = pop; }
    }
    if (nearest) {
      this.killPop(nearest);
      const line = this.add.graphics().setDepth(7);
      line.lineStyle(2, 0xffff00); line.lineBetween(this.player.x, this.player.y, nearest.x, nearest.y);
      this.time.delayedCall(100, () => line.destroy());
    }
  }

  killPop(pop) {
    if (!pop.alive) return;
    pop.alive = false;
    this.killCount++;
    this.hudKills.setText('Kills: ' + this.killCount);
    this.addXP(XP_PER_POP);
    this.tweens.add({
      targets: pop, scaleX: 0, scaleY: 0, alpha: 0, duration: 200,
      onComplete: () => {
        this.pops.remove(pop, true, true);
        if (this.waveState === 'spawning' && !pop.isBossMinion) {
          this.time.delayedCall(400, () => this.fillWave());
        }
      }
    });
  }

  killBoss() {
    this.boss.alive = false;
    this.killCount++;
    this.hudKills.setText('Kills: ' + this.killCount);
    this.destroyBossHPBar();
    this.tweens.add({
      targets: this.boss, scaleX: 0, scaleY: 0, alpha: 0, duration: 400,
      onComplete: () => { if (this.boss) { this.boss.destroy(); this.boss = null; } }
    });
    this.addXP(XP_PER_BOSS);
    this.showMsg('BOSS DEFEATED!');
    this.time.delayedCall(800, () => { if (!this.gameOver) this.dropEnchant(); });
    this.waveState = 'intermission';
    this.time.delayedCall(3500, () => { if (!this.gameOver) this.startWave(); });
  }

  // ==================== XP / LEVEL ====================

  addXP(amount) {
    this.player.xp += amount;
    while (this.player.xp >= this.player.xpToNext) {
      this.player.xp -= this.player.xpToNext;
      this.player.level++;
      this.player.xpToNext = BASE_XP * this.player.level;
      this.hudLevel.setText('LVL ' + this.player.level);
      this.showLevelUp();
    }
    this.updateXPBar();
  }

  showLevelUp() {
    this.paused = true;
    const W = this.scale.width, H = this.scale.height;
    const cx = W / 2, cy = H / 2;
    const fs = Math.round(Math.min(W, H) * 0.05);
    const fsS = Math.round(fs * 0.7);
    const cw = Math.round(W * 0.25), ch = Math.round(H * 0.2), gap = Math.round(W * 0.03);
    const totalW = 3 * cw + 2 * gap;
    const startX = cx - totalW / 2;
    const cardY = cy - ch / 2;

    const opts = [
      { name: 'POWER',  desc: '+20% damage',   apply: () => { this.player.stats.damage *= 1.2; } },
      { name: 'SPEED',  desc: '-15% atk cd',   apply: () => { this.player.stats.attackSpeed *= 0.85; } },
      { name: 'ARMOR',  desc: '-15% dmg taken', apply: () => { this.player.stats.defense += 1; } },
      { name: 'HEALTH', desc: '+25 max HP',     apply: () => {
        this.player.stats.maxHp += 25;
        this.player.hp = Math.min(this.player.hp + 25, this.player.stats.maxHp);
        this.hudHP.setText('HP: ' + Math.floor(this.player.hp));
        this.updateHPBar();
      }},
      { name: 'MOVE',   desc: '+15% speed',     apply: () => { this.player.stats.moveSpeed *= 1.15; } }
    ];
    const chosen = Phaser.Utils.Array.Shuffle(opts.slice()).slice(0, 3);
    const all = [];

    const ov = this.add.graphics().setScrollFactor(0).setDepth(38);
    ov.fillStyle(0x000000, 0.75); ov.fillRect(0, 0, W, H);
    all.push(ov);

    all.push(this.add.text(cx, cardY - fs * 1.5, 'LEVEL UP!', {
      fontSize: fs + 'px', fill: '#ffdd44', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(39));

    all.push(this.add.text(cx, cardY - fs * 0.5, 'Choose upgrade:', {
      fontSize: fsS + 'px', fill: '#ffffff', fontFamily: 'Arial', stroke: '#000', strokeThickness: 2
    }).setOrigin(0.5).setScrollFactor(0).setDepth(39));

    chosen.forEach((card, i) => {
      const x = startX + i * (cw + gap);
      const bg = this.add.graphics().setScrollFactor(0).setDepth(39);
      const draw = (h) => {
        bg.clear();
        bg.fillStyle(h ? 0x2a4a6a : 0x1a2a3a, 0.95);
        bg.fillRoundedRect(x, cardY, cw, ch, 8);
        bg.lineStyle(2, h ? 0x88bbff : 0x4488ff);
        bg.strokeRoundedRect(x, cardY, cw, ch, 8);
      };
      draw(false);
      const nt = this.add.text(x + cw / 2, cardY + ch * 0.3, card.name, {
        fontSize: fsS + 'px', fill: '#ffdd44', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 2
      }).setOrigin(0.5).setScrollFactor(0).setDepth(40);
      const dt = this.add.text(x + cw / 2, cardY + ch * 0.65, card.desc, {
        fontSize: Math.round(fsS * 0.85) + 'px', fill: '#aaddff', fontFamily: 'Arial', stroke: '#000', strokeThickness: 2
      }).setOrigin(0.5).setScrollFactor(0).setDepth(40);
      const zone = this.add.zone(x, cardY, cw, ch).setScrollFactor(0).setDepth(41).setOrigin(0).setInteractive();
      zone.on('pointerover', () => draw(true));
      zone.on('pointerout', () => draw(false));
      zone.on('pointerdown', () => { card.apply(); all.forEach(o => o.destroy()); this.paused = false; });
      all.push(bg, nt, dt, zone);
    });
  }

  // ==================== GEAR ====================

  dropEnchant() {
    const SLOTS = [
      { key: 'helm',   name: 'HELM',   stat: 'defense',    bonus: 0.5 },
      { key: 'sword',  name: 'SWORD',  stat: 'damage',     bonus: 0.15 },
      { key: 'armor',  name: 'ARMOR',  stat: 'defense',    bonus: 0.8 },
      { key: 'gloves', name: 'GLOVES', stat: 'attackSpeed',bonus: 0.1 },
      { key: 'boots',  name: 'BOOTS',  stat: 'moveSpeed',  bonus: 0.1 }
    ];
    const slot = SLOTS[Phaser.Math.Between(0, 4)];
    this.player.gear[slot.key]++;
    const lvl = this.player.gear[slot.key];
    if (slot.stat === 'attackSpeed') this.player.stats.attackSpeed = Math.max(0.3, this.player.stats.attackSpeed - slot.bonus);
    else if (slot.stat === 'damage')     this.player.stats.damage    += slot.bonus;
    else if (slot.stat === 'defense')    this.player.stats.defense   += slot.bonus;
    else if (slot.stat === 'moveSpeed')  this.player.stats.moveSpeed += slot.bonus;
    this.updateGearHUD();
    this.showMsg(slot.name + ' +' + lvl);
  }

  updateGearHUD() {
    if (!this.gearItems) return;
    const KEYS = ['helm', 'sword', 'armor', 'gloves', 'boots'];
    const LBL  = ['HLM', 'SWD', 'ARM', 'GLV', 'BOT'];
    KEYS.forEach((k, i) => {
      const lvl = this.player.gear[k] || 0;
      this.gearItems[i].setText(LBL[i] + (lvl > 0 ? '+' + lvl : ''));
      this.gearItems[i].setColor(lvl > 0 ? '#ffdd44' : '#556655');
    });
  }

  // ==================== HUD ====================

  createHUD() {
    const W = this.scale.width, H = this.scale.height;
    const fs = Math.round(Math.min(W, H) * 0.045);
    const fsS = Math.round(fs * 0.72);
    const px = Math.round(W * 0.02);
    const lh = Math.round(fs * 1.4);
    const barW = Math.round(W * 0.38);

    const s  = { fontSize: fs  + 'px', fill: '#ffffff', fontFamily: 'Arial', stroke: '#000', strokeThickness: 3 };
    const sS = { fontSize: fsS + 'px', fill: '#ffdd44', fontFamily: 'Arial', stroke: '#000', strokeThickness: 2 };

    let y = Math.round(H * 0.03);
    this.hudKills = this.add.text(px, y, 'Kills: 0', s).setScrollFactor(0).setDepth(20); y += lh;
    this.hudHP    = this.add.text(px, y, 'HP: 100',  s).setScrollFactor(0).setDepth(20); y += lh;
    this.hudWave  = this.add.text(px, y, 'Wave 1',   s).setScrollFactor(0).setDepth(20); y += lh + 2;

    // HP bar
    this._hpBar = { x: px, y, w: barW, h: Math.max(6, Math.round(H * 0.013)) };
    this.hpBg   = this.add.graphics().setScrollFactor(0).setDepth(20);
    this.hpFill = this.add.graphics().setScrollFactor(0).setDepth(21);
    this.updateHPBar();
    y += this._hpBar.h + 6;

    this.hudLevel = this.add.text(px, y, 'LVL 1', sS).setScrollFactor(0).setDepth(20); y += fsS + 4;

    // XP bar
    this._xpBar = { x: px, y, w: barW, h: Math.max(4, Math.round(H * 0.009)) };
    this.xpBg   = this.add.graphics().setScrollFactor(0).setDepth(20);
    this.xpFill = this.add.graphics().setScrollFactor(0).setDepth(21);
    this.updateXPBar();

    // Gear strip
    const gfs = Math.round(Math.min(W, H) * 0.032);
    const gearY = Math.round(H * 0.91);
    const slotW = Math.round(W / 5);
    const gearBg = this.add.graphics().setScrollFactor(0).setDepth(19);
    gearBg.fillStyle(0x000000, 0.55);
    gearBg.fillRect(0, Math.round(H * 0.89), W, Math.round(H * 0.11));
    this.gearItems = [];
    const LBL = ['HLM', 'SWD', 'ARM', 'GLV', 'BOT'];
    for (let i = 0; i < 5; i++) {
      const t = this.add.text(i * slotW + slotW / 2, gearY, LBL[i], {
        fontSize: gfs + 'px', fill: '#556655', fontFamily: 'Arial', stroke: '#000', strokeThickness: 2, align: 'center'
      }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(20);
      this.gearItems.push(t);
    }
  }

  updateHPBar() {
    const { x, y, w, h } = this._hpBar;
    this.hpBg.clear(); this.hpBg.fillStyle(0x111111, 0.9); this.hpBg.fillRect(x, y, w, h);
    this.hpFill.clear();
    const pct = Math.max(0, Math.min(1, this.player.hp / this.player.stats.maxHp));
    const col = pct > 0.6 ? 0x44ff44 : pct > 0.3 ? 0xffaa00 : 0xff3333;
    this.hpFill.fillStyle(col); this.hpFill.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * pct), h - 2);
  }

  updateXPBar() {
    const { x, y, w, h } = this._xpBar;
    this.xpBg.clear(); this.xpBg.fillStyle(0x111111, 0.9); this.xpBg.fillRect(x, y, w, h);
    this.xpFill.clear();
    const pct = Math.min(1, this.player.xp / this.player.xpToNext);
    this.xpFill.fillStyle(0xffdd00); this.xpFill.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * pct), h - 2);
  }

  // ==================== BOSS HP BAR ====================

  createBossHPBar() {
    if (this.bossBg) { this.bossBg.destroy(); this.bossFill.destroy(); this.bossLabel.destroy(); }
    const W = this.scale.width, H = this.scale.height;
    const bw = Math.round(W * 0.6), bh = Math.max(6, Math.round(H * 0.015));
    const bx = (W - bw) / 2, by = Math.round(H * 0.85);
    const fs = Math.round(Math.min(W, H) * 0.03);
    this._bossBar = { x: bx, y: by, w: bw, h: bh };
    this.bossLabel = this.add.text(W / 2, by - fs - 4, 'BOSS', {
      fontSize: fs + 'px', fill: '#ff4444', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 2
    }).setOrigin(0.5).setScrollFactor(0).setDepth(22);
    this.bossBg   = this.add.graphics().setScrollFactor(0).setDepth(22);
    this.bossFill = this.add.graphics().setScrollFactor(0).setDepth(23);
    this.updateBossHPBar();
  }

  updateBossHPBar() {
    if (!this.bossBg || !this._bossBar) return;
    const { x, y, w, h } = this._bossBar;
    this.bossBg.clear(); this.bossBg.fillStyle(0x222222, 0.9); this.bossBg.fillRect(x, y, w, h);
    this.bossFill.clear();
    const pct = Math.max(0, this.boss ? this.boss.hp / this.boss.maxHp : 0);
    this.bossFill.fillStyle(0xff2222); this.bossFill.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * pct), h - 2);
  }

  destroyBossHPBar() {
    ['bossBg','bossFill','bossLabel'].forEach(k => { if (this[k]) { this[k].destroy(); this[k] = null; } });
    this._bossBar = null;
  }

  // ==================== MESSAGES ====================

  showMsg(text) {
    const W = this.scale.width, H = this.scale.height;
    const fs = Math.round(Math.min(W, H) * 0.055);
    const t = this.add.text(W / 2, H * 0.18, text, {
      fontSize: fs + 'px', fill: '#ffdd44', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(25);
    this.tweens.add({ targets: t, alpha: 0, y: t.y - 30, duration: 2000, delay: 1000, onComplete: () => t.destroy() });
  }

  // ==================== GAME OVER ====================

  showGameOver() {
    this.gameOver = true;
    const W = this.scale.width, H = this.scale.height;
    const cx = W / 2, cy = H / 2;
    const fs = Math.round(Math.min(W, H) * 0.07);
    const fsS = Math.round(fs * 0.55);

    const ov = this.add.graphics().setScrollFactor(0).setDepth(30);
    ov.fillStyle(0x000000, 0.8); ov.fillRect(0, 0, W, H);

    this.add.text(cx, cy - fs * 1.8, 'GAME OVER', {
      fontSize: fs + 'px', fill: '#ff4444', fontFamily: 'Arial Black', stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setScrollFactor(0).setDepth(31);

    [
      ['Kills: ' + this.killCount, '#ffffff', cy - fs * 0.4],
      ['Wave: '  + this.waveNum,   '#88ddff', cy + fsS * 0.5],
      ['Level: ' + this.player.level, '#ffdd44', cy + fsS * 1.5]
    ].forEach(([txt, col, y]) => {
      this.add.text(cx, y, txt, {
        fontSize: fsS + 'px', fill: col, fontFamily: 'Arial', stroke: '#000', strokeThickness: 3
      }).setOrigin(0.5).setScrollFactor(0).setDepth(31);
    });

    const KEYS = ['helm','sword','armor','gloves','boots'];
    const LBL  = ['HLM','SWD','ARM','GLV','BOT'];
    const gs = KEYS.map((k,i) => { const l = this.player.gear[k]||0; return LBL[i]+(l>0?'+'+l:''); }).join('  ');
    this.add.text(cx, cy + fsS * 2.5, gs, {
      fontSize: fsS + 'px', fill: '#ffdd44', fontFamily: 'Arial', stroke: '#000', strokeThickness: 2
    }).setOrigin(0.5).setScrollFactor(0).setDepth(31);

    const btn = this.add.text(cx, cy + fsS * 3.8, '[ RESTART ]', {
      fontSize: fsS + 'px', fill: '#44ff88', fontFamily: 'Arial Black',
      stroke: '#000', strokeThickness: 3, backgroundColor: '#1a3a1a', padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setScrollFactor(0).setDepth(31).setInteractive();
    btn.on('pointerover', () => btn.setStyle({ fill: '#88ffaa' }));
    btn.on('pointerout',  () => btn.setStyle({ fill: '#44ff88' }));
    btn.on('pointerdown', () => this.scene.restart());
  }

  // ==================== JOYSTICK ====================

  joyDown(p) {
    if (!this.joy.active) {
      this.joy = { active: true, startX: p.x, startY: p.y, dx: 0, dy: 0, pid: p.id };
      this.joyBase.clear();
      this.joyBase.lineStyle(2, 0xffffff, 0.3); this.joyBase.fillStyle(0xffffff, 0.1);
      this.joyBase.fillCircle(p.x, p.y, 50); this.joyBase.strokeCircle(p.x, p.y, 50);
      this.joyKnob.clear(); this.joyKnob.fillStyle(0xffffff, 0.4); this.joyKnob.fillCircle(p.x, p.y, 22);
    }
  }

  joyMove(p) {
    if (!this.joy.active || p.id !== this.joy.pid) return;
    const dx = p.x - this.joy.startX, dy = p.y - this.joy.startY;
    const len = Math.sqrt(dx*dx + dy*dy), r = 50;
    if (len > 0) { this.joy.dx = (dx/len)*Math.min(len,r)/r; this.joy.dy = (dy/len)*Math.min(len,r)/r; }
    const cx = this.joy.startX + this.joy.dx * r, cy = this.joy.startY + this.joy.dy * r;
    this.joyKnob.clear(); this.joyKnob.fillStyle(0xffffff, 0.4); this.joyKnob.fillCircle(cx, cy, 22);
  }

  joyUp(p) {
    if (p.id !== this.joy.pid) return;
    this.joy.active = false; this.joy.dx = 0; this.joy.dy = 0;
    this.joyBase.clear(); this.joyKnob.clear();
  }

  // ==================== UPDATE ====================

  update(time, delta) {
    if (this.gameOver || this.paused) return;
    const dt = delta / 1000;

    // Movement
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown  || this.wasd.left.isDown)  vx = -1;
    else if (this.cursors.right.isDown || this.wasd.right.isDown) vx = 1;
    if (this.cursors.up.isDown    || this.wasd.up.isDown)    vy = -1;
    else if (this.cursors.down.isDown  || this.wasd.down.isDown)  vy = 1;
    if (this.joy.active) { vx = this.joy.dx; vy = this.joy.dy; }
    if (vx && vy) { vx *= 0.707; vy *= 0.707; }
    const spd = PLAYER_SPEED * this.player.stats.moveSpeed;
    this.player.x = Phaser.Math.Clamp(this.player.x + vx * spd * dt, 16, ARENA_W - 16);
    this.player.y = Phaser.Math.Clamp(this.player.y + vy * spd * dt, 16, ARENA_H - 16);

    // Wave end check
    if (this.waveState === 'spawning' &&
        this.popSpawned >= this.popToSpawn &&
        this.pops.getChildren().filter(p => p.alive && !p.isBossMinion).length === 0) {
      this.waveState = 'boss';
      this.time.delayedCall(1000, () => { if (!this.gameOver) this.spawnBoss(); });
    }

    // Pop movement & damage
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      const dx = this.player.x - pop.x, dy = this.player.y - pop.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 18) {
        pop.x += (dx/dist) * POP_SPEED * dt;
        pop.y += (dy/dist) * POP_SPEED * dt;
      } else {
        const last = this.player.lastDamageTime.get(pop) || 0;
        if (time - last > POP_DAMAGE_COOLDOWN) {
          this.player.lastDamageTime.set(pop, time);
          const dmg = POP_DAMAGE * Math.max(0.1, 1 - this.player.stats.defense * 0.15);
          this.player.hp = Math.max(0, this.player.hp - dmg);
          this.hudHP.setText('HP: ' + Math.floor(this.player.hp));
          this.updateHPBar();
          this.tweens.add({ targets: this.player, alpha: 0.3, duration: 100, yoyo: true });
          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
    }

    // Boss movement & damage
    if (this.boss && this.boss.alive) {
      const dx = this.player.x - this.boss.x, dy = this.player.y - this.boss.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 48) {
        this.boss.x += (dx/dist) * 50 * dt;
        this.boss.y += (dy/dist) * 50 * dt;
      } else {
        const last = this.player.lastDamageTime.get(this.boss) || 0;
        if (time - last > 800) {
          this.player.lastDamageTime.set(this.boss, time);
          const dmg = 20 * Math.max(0.1, 1 - this.player.stats.defense * 0.15);
          this.player.hp = Math.max(0, this.player.hp - dmg);
          this.hudHP.setText('HP: ' + Math.floor(this.player.hp));
          this.updateHPBar();
          this.tweens.add({ targets: this.player, alpha: 0.2, duration: 150, yoyo: true });
          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
      // Minions orbit boss
      const alive = this.bossMinions.filter(m => m.alive);
      alive.forEach((m, i) => {
        const a = (i / alive.length) * Math.PI * 2 + time * 0.001;
        m.x = this.boss.x + Math.cos(a) * 70;
        m.y = this.boss.y + Math.sin(a) * 70;
      });
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#0a1a0a',
  scene: GameScene,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
};

new Phaser.Game(config);
</script>
