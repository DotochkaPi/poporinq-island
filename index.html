<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Poporing Island</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
button, input { font-family: 'Press Start 2P', monospace; }
html { width: 100%; height: 100%; }
body { width: 100%; height: 100%; overflow: hidden; background: #1a3a5c; }
canvas { display: block; width: 100% !important; height: 100% !important; }
canvas { display: block; }

/* HUD overlay — always on top, always in screen pixels */
#hud {
  position: fixed;
  top: env(safe-area-inset-top, 0);
  left: env(safe-area-inset-left, 0);
  right: env(safe-area-inset-right, 0);
  bottom: env(safe-area-inset-bottom, 0);
  pointer-events: none; z-index: 10;
  font-family: 'Press Start 2P', monospace;
  -webkit-text-stroke: 0;
}
#hud-top {
  position: absolute; top: 3%; left: 2%;
  color: #fff; text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
}
#hud-top .row { font-size: 4vmin; line-height: 1.5; }
#hud-top .lvl { font-size: 3vmin; color: #ffdd44; margin-top: 2px; }
.bar-wrap { width: 19vw; height: 0.8vmin; background: #111; border-radius: 2px; margin: 1px 0; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 0.15s; }
#hp-fill  { background: #44ff44; }
#xp-fill  { background: #ffdd00; }

#gear-strip {
  position: absolute; bottom: 0; left: 0; width: 100%;
  background: rgba(0,0,0,0.55);
  display: flex; justify-content: space-around; align-items: center;
  padding: 1.5vmin 0;
  pointer-events: none;
}
.gear-slot {
  font-size: 3vmin; color: #556655;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
  text-align: center; min-width: 18%;
}
.gear-slot.active { color: #ffdd44; }

#boss-bar {
  position: absolute; bottom: 14%; left: 20%; width: 60%;
  display: none;
}
#boss-label {
  text-align: center; color: #ff4444; font-size: 3vmin; font-weight: bold;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000; margin-bottom: 3px;
}
#boss-fill { background: #ff2222; width: 100%; }

#msg {
  position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
  font-size: 6vmin; font-weight: bold; color: #ffdd44;
  text-shadow: -2px -2px 0 #000, 2px 2px 0 #000;
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.3s; text-align: center;
}
#msg-sub {
  position: absolute; top: 26%; left: 50%; transform: translateX(-50%);
  font-size: 3.5vmin; font-weight: normal; color: #aaddff;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
  pointer-events: none; white-space: nowrap;
  transition: opacity 0.3s; text-align: center;
}

#levelup-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: rgba(0,0,0,0.75); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; pointer-events: auto; font-family: 'Press Start 2P', monospace;
}
#levelup-overlay h2 { font-size: 7vmin; color: #ffdd44; margin-bottom: 1vmin; text-shadow: 0 0 10px #ffaa00; }
#levelup-overlay p  { font-size: 3vmin; color: #fff; margin-bottom: 3vmin; }
#levelup-cards { display: flex; gap: 2vmin; flex-wrap: wrap; justify-content: center; max-width: 95vw; }
.lcard {
  width: 26vw; min-width: 80px; max-width: 160px; padding: 2.5vmin 2vmin;
  background: #1a2a3a; border: 2px solid #4488ff; border-radius: 10px;
  cursor: pointer; text-align: center; transition: background 0.15s, border-color 0.15s;
  pointer-events: auto; box-sizing: border-box;
}
.lcard:hover { background: #2a4a6a; border-color: #88bbff; }
.lcard .cn { font-size: min(4vmin, 16px); color: #ffdd44; font-weight: bold; margin-bottom: 1vmin; word-break: break-word; }
.lcard .cd { font-size: min(3vmin, 13px); color: #aaddff; word-break: break-word; }

#gameover-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: rgba(0,0,0,0.88); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 20; pointer-events: auto;
  font-family: 'Press Start 2P', monospace; text-align: center;
}
#go-inner {
  width: 90vw; max-width: 400px;
  display: flex; flex-direction: column; align-items: center; gap: 2.5vmin;
  color: #fff; text-align: center; padding: 0 4vw;
}
#go-inner * { text-align: center; }
#go-btn-row { justify-content: center; }
#go-save-row { justify-content: center; }
#gameover-overlay h1 {
  font-size: clamp(14px, 4.5vw, 32px); color: #ff4444; margin: 0;
  text-shadow: 0 0 20px #ff000066, -1px -1px 0 #000, 1px 1px 0 #000;
  letter-spacing: 2px; white-space: nowrap;
}
#go-stats {
  font-size: clamp(7px, 2vw, 12px); color: #fff;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
  text-align: center; white-space: nowrap; line-height: 2;
}
#go-gear {
  font-size: clamp(7px, 2vmin, 12px); color: #ffdd44;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
  text-align: center; white-space: nowrap;
}
#go-gear .dim { color: #445544; }

/* Relics block */
#go-relics-wrap { width: 100%; }
#go-relics-title {
  font-size: 3vmin; color: #ffdd44;
  text-shadow: -1px -1px 0 #000;
  margin-bottom: 1vmin;
}
#go-relics {
  max-height: 22vmin; overflow-y: auto;
  display: flex; flex-direction: column; gap: 0.8vmin;
  padding-right: 1vmin;
}
#go-relics::-webkit-scrollbar { width: 3px; }
#go-relics::-webkit-scrollbar-thumb { background: #445544; border-radius: 2px; }
.go-relic-name {
  font-size: 2.8vmin;
  text-shadow: -1px -1px 0 #000, 1px 1px 0 #000;
}

/* Save block */
#save-score-block { width: 100%; }
#save-score-block p { font-size: 2.8vmin; color: #888; margin-bottom: 1.5vmin; text-align: center; }
#player-name-input {
  width: 100%; box-sizing: border-box;
  font-size: 3.5vmin; padding: 1.5vmin 2vmin; border-radius: 6px;
  border: 2px solid #445544; background: #0a140a; color: #fff;
  margin-bottom: 1.5vmin;
}
#go-save-row { display: flex; gap: 2vmin; align-items: center; }
#save-btn {
  flex: 1; padding: 1.5vmin; font-size: clamp(7px, 2vmin, 12px);
  color: #44ff88; background: #0a1f0a; border: 2px solid #44ff88;
  border-radius: 8px; cursor: pointer; white-space: nowrap;
}
#save-btn:hover { color: #88ffaa; border-color: #88ffaa; }
#skip-save-btn {
  font-size: clamp(7px, 2vmin, 11px); color: #445544;
  background: transparent; border: none; cursor: pointer; padding: 1vmin;
}
#save-result { font-size: 2.8vmin; color: #44ff88; margin-top: 1vmin; min-height: 3vmin; text-align: center; }

/* Bottom buttons */
#go-btn-row { display: flex; gap: 3vmin; width: 100%; }
#restart-btn {
  flex: 1; padding: 2vmin; font-size: clamp(8px, 2.2vmin, 14px);
  color: #44ff88; background: #0a1f0a; border: 2px solid #44ff88;
  border-radius: 8px; cursor: pointer; white-space: nowrap;
}
#restart-btn:hover { color: #88ffaa; border-color: #88ffaa; }
#share-btn {
  flex: 1; padding: 2vmin; font-size: clamp(8px, 2.2vmin, 14px);
  color: #88ccff; background: #0a1a2a; border: 2px solid #88ccff;
  border-radius: 8px; cursor: pointer; white-space: nowrap;
}
#share-btn:hover { color: #aaddff; border-color: #aaddff; }

/* Leaderboard overlay */
#lb-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: rgba(0,0,0,0.92); display: none;
  flex-direction: column; align-items: center; justify-content: flex-start;
  z-index: 50; padding: 4vmin 2vmin; overflow-y: auto;
}
#lb-overlay h2 { font-size: 7vmin; color: #ffdd44; margin-bottom: 3vmin; }
#lb-table { width: 100%; max-width: 600px; border-collapse: collapse; }
#lb-table th { font-size: 2.5vmin; color: #888; padding: 1vmin; border-bottom: 1px solid #333; text-align: left; }
#lb-table td { font-size: 3vmin; color: #fff; padding: 1.2vmin 1vmin; border-bottom: 1px solid #1a1a1a; }
#lb-table tr.highlight td { color: #ffdd44; background: rgba(255,221,68,0.08); }
#lb-table tr:nth-child(1) td { color: #ffd700; }
#lb-table tr:nth-child(2) td { color: #c0c0c0; }
#lb-table tr:nth-child(3) td { color: #cd7f32; }
#lb-separator td { border-top: 1px dashed #444; color: #555 !important; font-size: 2.5vmin !important; }
#lb-close-btn {
  margin-top: 3vmin; padding: 2vmin 6vmin; font-size: 4vmin;
  color: #aaa; background: transparent; border: 2px solid #444;
  border-radius: 8px; cursor: pointer;
}

#start-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: rgba(0,0,0,0.88); display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 30; font-family: 'Press Start 2P', monospace;
}
#start-overlay .title { font-size: 10vmin; font-weight: bold; color: #ffdd44; letter-spacing: 4px;
  text-shadow: 0 0 30px #ffaa00, 0 0 60px #ff8800; margin-bottom: 1vmin; }
#start-overlay .subtitle { font-size: 3.5vmin; color: #aaa; margin-bottom: 6vmin; letter-spacing: 2px; }
#start-overlay .hint { font-size: 2.8vmin; color: #556655; margin-top: 3vmin; }
#start-btn {
  padding: 2.5vmin 8vmin; font-size: 5vmin; font-weight: bold;
  color: #44ff88; background: #0a1f0a; border: 3px solid #44ff88;
  border-radius: 10px; cursor: pointer; letter-spacing: 2px;
  animation: pulse 1.5s ease-in-out infinite;
}
#start-btn:hover { color: #88ffaa; border-color: #88ffaa; background: #142814; }

#pause-btn {
  position: fixed; top: 2%; right: 2%;
  width: 10vmin; height: 10vmin; font-size: 5vmin;
  background: rgba(0,0,0,0.5); border: 2px solid #556655;
  border-radius: 8px; color: #aaa; cursor: pointer;
  z-index: 15; display: none; pointer-events: auto;
  line-height: 1;
}
#pause-btn:hover { border-color: #88ffaa; color: #fff; }

#pause-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: rgba(0,0,0,0.7); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 20;
}
#pause-overlay h2 { font-size: 10vmin; color: #ffdd44; margin-bottom: 4vmin; }
#resume-btn {
  padding: 2vmin 6vmin; font-size: 5vmin; font-weight: bold;
  color: #44ff88; background: #0a1f0a; border: 3px solid #44ff88;
  border-radius: 10px; cursor: pointer;
}
#resume-btn:hover { color: #88ffaa; border-color: #88ffaa; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 10px #44ff8866; }
  50%       { box-shadow: 0 0 25px #44ff88cc; }
}
#go-relics { font-size: 2.8vmin; margin: 1.5vmin 2vmin; text-align: left; max-height: 25vh; overflow-y: auto; }
#go-relics .relic-line { margin: 0.4vmin 0; }
#go-relics-title { font-size: 3vmin; color: #ffdd44; margin-top: 2vmin; }

#relic-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
  background: rgba(0,0,0,0.75); display: none;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 25; pointer-events: auto;
}
.relic-card {
  min-width: 55vw; max-width: 85vw; padding: 4vmin 5vmin;
  border-radius: 12px; border-width: 3px; border-style: solid;
  text-align: center; position: relative;
  animation: relicPop 0.3s ease-out;
}
@keyframes relicPop {
  from { transform: scale(0.7); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.relic-quality { font-size: 3vmin; font-weight: bold; letter-spacing: 2px; margin-bottom: 1.5vmin; text-transform: uppercase; }
.relic-name    { font-size: 6vmin; font-weight: bold; margin-bottom: 1vmin; color: #fff; text-shadow: 0 0 12px currentColor; }
.relic-flavor  { font-size: 2.8vmin; color: #ccc; margin-bottom: 3vmin; font-style: italic; }
.relic-btn {
  padding: 1.5vmin 5vmin; font-size: 3.5vmin; font-weight: bold;
  border-radius: 8px; border: 2px solid; cursor: pointer;
  background: rgba(0,0,0,0.4);
}
</style>
</head>
<body>

<!-- HTML HUD — works on any resolution -->
<div id="hud">
  <div id="hud-top">
    <div class="row" id="h-kills">Kills: 0</div>
    <div class="row" id="h-hp">HP: 100</div>
    <div class="bar-wrap"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
    <div class="row" id="h-wave">Wave 1</div>
    <div class="lvl" id="h-lvl">LVL 1</div>
    <div class="bar-wrap"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
  </div>

  <div id="gear-strip">
    <div class="gear-slot" id="g-helm">HLM</div>
    <div class="gear-slot" id="g-sword">SWD</div>
    <div class="gear-slot" id="g-armor">ARM</div>
    <div class="gear-slot" id="g-gloves">GLV</div>
    <div class="gear-slot" id="g-boots">BOT</div>
  </div>

  <div id="boss-bar">
    <div id="boss-label">BOSS</div>
    <div class="bar-wrap" style="width:100%;height:2vmin">
      <div class="bar-fill" id="boss-fill" style="width:100%"></div>
    </div>
  </div>

  <div id="msg" style="opacity:0"></div>
  <div id="msg-sub" style="opacity:0"></div>
</div>

<!-- Level up overlay -->
<div id="levelup-overlay">
  <h2>LEVEL UP!</h2>
  <p>Choose upgrade:</p>
  <div id="levelup-cards"></div>
</div>

<button id="pause-btn" onclick="window._togglePause && window._togglePause()">⏸</button>

<div id="pause-overlay">
  <h2>PAUSE</h2>
  <button id="resume-btn" onclick="window._togglePause && window._togglePause()">[ RESUME ]</button>
</div>

<!-- Leaderboard overlay -->
<div id="lb-overlay">
  <h2>🏆 LEADERBOARD</h2>
  <table id="lb-table">
    <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Wave</th><th>Kills</th><th>Lvl</th></tr></thead>
    <tbody id="lb-body"></tbody>
  </table>
  <button id="lb-close-btn" onclick="document.getElementById('lb-overlay').style.display='none'">[ CLOSE ]</button>
</div>

<!-- Start screen -->
<div id="start-overlay">
  <div class="title">POPORING ISLAND</div>
  <div class="subtitle">⚔️ Survive the waves</div>
  <button id="start-btn" onclick="document.getElementById('start-overlay').style.display='none'; window._startGame && window._startGame()">[ START ]</button>
  <div class="hint">WASD / joystick to move · auto-attack</div>
  <button id="lb-start-btn" onclick="window._openLeaderboard()" style="margin-top:3vmin;padding:1.5vmin 4vmin;font-size:3.5vmin;color:#aaa;background:transparent;border:2px solid #444;border-radius:8px;cursor:pointer;">[ LEADERBOARD ]</button>
</div>

<!-- Relic overlay -->
<div id="relic-overlay">
  <div class="relic-card" id="relic-card">
    <div class="relic-quality" id="relic-quality"></div>
    <div class="relic-name" id="relic-name"></div>
    <div class="relic-flavor" id="relic-flavor"></div>
    <button class="relic-btn" id="relic-btn" onclick="window._relicClose && window._relicClose()">Забрать</button>
  </div>
</div>

<!-- Game over overlay -->
<div id="gameover-overlay">
  <div id="go-inner">
    <h1>GAME OVER</h1>
    <div id="go-stats"></div>
    <div id="go-gear"></div>

    <div id="go-relics-wrap" style="display:none; width:100%">
      <div id="go-relics-title"></div>
      <div id="go-relics"></div>
    </div>

    <div id="save-score-block">
      <p>Save your score?</p>
      <input id="player-name-input" type="text" maxlength="20" placeholder="Your name"/>
      <div id="go-save-row">
        <button id="save-btn" onclick="window._saveScore && window._saveScore()">SAVE</button>
        <button id="skip-save-btn" onclick="document.getElementById('save-score-block').style.display='none'">skip</button>
      </div>
      <div id="save-result"></div>
    </div>

    <div id="go-btn-row">
      <button id="restart-btn" onclick="location.reload()">RESTART</button>
      <button id="share-btn" onclick="window._shareResult && window._shareResult()">SHARE</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
// --- CONSTANTS ---
const ARENA_W = 1200;
const ARENA_H = 1200;
const PLAYER_SPEED = 200;
const POP_SPEED = 80;
const ATTACK_RADIUS = 69;
let ATTACK_RADIUS_MULT = 1.0;
const ATTACK_INTERVAL = 1500;
const POP_DAMAGE = 10;
const POP_DAMAGE_COOLDOWN = 1000;
const XP_PER_POP = 10;
const XP_PER_BOSS = 100;
const BASE_XP = 50;
// Wave count: n = round(10 + (wave-1)*7 + (wave-1)^1.4)

// ==================== SUPABASE ====================
const SB_URL = 'https://rrkmyikquaapgdflrfoa.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJya215aWtxdWFhcGdkZmxyZm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MTk3ODYsImV4cCI6MjA5MDA5NTc4Nn0.0xwtZHLT2fVbIibqs1Ybxutz--HhdlIlKkgBkNyplio';

const sbFetch = (path, opts) => fetch(SB_URL + path, {
  ...opts,
  headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', ...(opts && opts.headers) }
});

const ADJECTIVES = ['Red','Dark','Iron','Swift','Brave','Gold','Storm','Frost','Shadow','Steel','Wild','Grim'];
const generateName = () => ADJECTIVES[Math.floor(Math.random()*ADJECTIVES.length)] + 'Knight#' + String(Math.floor(Math.random()*9000)+1000);

const calcScore = (wave, kills, level, relics) => kills*10 + wave*100 + level*50 + relics*200;

window._openLeaderboard = async (highlightName) => {
  document.getElementById('lb-overlay').style.display = 'flex';
  document.getElementById('lb-body').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">Loading...</td></tr>';
  try {
    const res = await sbFetch('/rest/v1/leaderboard?select=*&order=score.desc&limit=100');
    const rows = await res.json();
    const top20 = rows.slice(0, 20);
    let html = '';
    top20.forEach((r, i) => {
      const isMe = highlightName && r.name === highlightName;
      html += `<tr class="${isMe ? 'highlight' : ''}">
        <td>${i+1}</td><td>${r.name}</td><td>${r.score}</td>
        <td>${r.wave}</td><td>${r.kills}</td><td>${r.level}</td>
      </tr>`;
    });
    // Find player position if not in top 20
    if (highlightName) {
      const myIdx = rows.findIndex(r => r.name === highlightName);
      if (myIdx >= 20) {
        html += `<tr class="lb-separator"><td colspan="6">· · ·</td></tr>`;
        const r = rows[myIdx];
        html += `<tr class="highlight"><td>${myIdx+1}</td><td>${r.name}</td><td>${r.score}</td>
          <td>${r.wave}</td><td>${r.kills}</td><td>${r.level}</td></tr>`;
      }
    }
    document.getElementById('lb-body').innerHTML = html || '<tr><td colspan="6" style="text-align:center;color:#888">No scores yet</td></tr>';
  } catch(e) {
    document.getElementById('lb-body').innerHTML = '<tr><td colspan="6" style="text-align:center;color:#f44">Failed to load</td></tr>';
  }
};

// ==================== SOUND ENGINE ====================
const SFX = (() => {
  let ctx = null;
  const getCtx = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  };

  const play = (freq, type, duration, volume, freqEnd, attack, decay) => {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.connect(gain);
      gain.connect(c.destination);
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, c.currentTime + duration);
      gain.gain.setValueAtTime(0, c.currentTime);
      gain.gain.linearRampToValueAtTime(volume || 0.3, c.currentTime + (attack || 0.01));
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
      osc.start(c.currentTime);
      osc.stop(c.currentTime + duration + (decay || 0));
    } catch(e) {}
  };

  return {
    swing:   () => { play(300, 'sawtooth', 0.08, 0.25, 150); play(500, 'square', 0.05, 0.1, 200); },
    hit:     () => { play(150, 'square', 0.06, 0.3, 80); },
    crit:    () => { play(400, 'sawtooth', 0.05, 0.35, 200); play(600, 'square', 0.08, 0.2, 300); },
    popDie:  () => { play(440, 'square', 0.07, 0.2, 220); },
    hurt:    () => { play(180, 'sawtooth', 0.1, 0.35, 100); },
    levelup: () => {
      [523, 659, 784, 1047].forEach((f, i) => {
        setTimeout(() => play(f, 'square', 0.15, 0.2), i * 80);
      });
    },
    bossSpawn: () => {

// ==================== AMBIENT MUSIC ====================
const AMBIENT = (() => {
  let ctx = null, running = false, nodes = [];

  const getCtx = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  };

  // Drone layer: slow low rumble
  const makeDrone = (c, freq, vol) => {
    const osc = c.createOscillator();
    const gain = c.createGain();
    const filter = c.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    filter.type = 'lowpass';
    filter.frequency.value = 300;
    gain.gain.value = vol;
    osc.connect(filter); filter.connect(gain); gain.connect(c.destination);
    osc.start();
    // Slow vibrato
    const lfo = c.createOscillator();
    const lfoGain = c.createGain();
    lfo.frequency.value = 0.15;
    lfoGain.gain.value = 1.5;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    lfo.start();
    nodes.push(osc, lfo, gain);
    return gain;
  };

  // Pad layer: slow chord sweep
  const makePad = (c) => {
    const notes = [55, 82.5, 110, 130.8]; // A1, E2, A2, C3 minor feel
    notes.forEach((freq, i) => {
      const osc = c.createOscillator();
      const gain = c.createGain();
      const filter = c.createBiquadFilter();
      osc.type = 'sine';
      osc.frequency.value = freq;
      filter.type = 'lowpass';
      filter.frequency.value = 600;
      gain.gain.value = 0.04;
      osc.connect(filter); filter.connect(gain); gain.connect(c.destination);
      // Each note slowly pulses
      const pulsePeriod = 4 + i * 1.3;
      const pulse = c.createOscillator();
      const pulseGain = c.createGain();
      pulse.frequency.value = 1 / pulsePeriod;
      pulseGain.gain.value = 0.025;
      pulse.connect(pulseGain); pulseGain.connect(gain.gain);
      osc.start(); pulse.start();
      nodes.push(osc, pulse, gain);
    });
  };

  // Occasional high ping
  const schedulePing = (c) => {
    if (!running) return;
    const delay = 3000 + Math.random() * 7000;
    setTimeout(() => {
      if (!running) return;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880 + Math.random() * 440;
      gain.gain.setValueAtTime(0, c.currentTime);
      gain.gain.linearRampToValueAtTime(0.04, c.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 2.5);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(c.currentTime); osc.stop(c.currentTime + 2.6);
      schedulePing(c);
    }, delay);
  };

  return {
    start() {
      if (running) return;
      running = true;
      const c = getCtx();
      if (c.state === 'suspended') c.resume();
      makeDrone(c, 55, 0.06);   // A1 deep rumble
      makeDrone(c, 82.5, 0.04); // E2 fifth
      makePad(c);
      schedulePing(c);
    },
    stop() {
      running = false;
      nodes.forEach(n => { try { n.stop ? n.stop() : n.disconnect(); } catch(e){} });
      nodes = [];
    },
    setTense(on) {
      // Boss fight: increase drone pitch slightly
    }
  };
})();

class GameScene extends Phaser.Scene {
  constructor() { super('GameScene'); }

  buildTerrain() {
    const W = ARENA_W, H = ARENA_H;
    const rng = (min, max) => min + Math.random() * (max - min);
    const rngInt = (min, max) => Math.floor(rng(min, max));

    // --- WATER (outside arena) ---
    const water = this.add.graphics().setDepth(-3);
    water.fillStyle(0x1a3a5c); water.fillRect(-200, -200, W+400, H+400);
    // Water shimmer patches
    for (let i = 0; i < 80; i++) {
      const wx = rng(-180, W+180), wy = rng(-180, H+180);
      const skip = wx > 0 && wx < W && wy > 0 && wy < H;
      if (!skip) {
        water.fillStyle(0x1e4a72, rng(0.2, 0.5));
        water.fillEllipse(wx, wy, rng(20, 80), rng(8, 30));
      }
    }

    // --- SAND BORDER ---
    const sand = this.add.graphics().setDepth(-2);
    const sandW = 55;
    // Sand fill around edges
    sand.fillStyle(0xc8a84b);
    sand.fillRect(0, 0, W, sandW);           // top
    sand.fillRect(0, H-sandW, W, sandW);     // bottom
    sand.fillRect(0, 0, sandW, H);           // left
    sand.fillRect(W-sandW, 0, sandW, H);     // right
    // Sand texture dots
    for (let i = 0; i < 300; i++) {
      let sx, sy;
      const side = rngInt(0, 4);
      if (side===0) { sx=rng(0,W); sy=rng(0,sandW); }
      else if (side===1) { sx=rng(0,W); sy=rng(H-sandW,H); }
      else if (side===2) { sx=rng(0,sandW); sy=rng(0,H); }
      else { sx=rng(W-sandW,W); sy=rng(0,H); }
      sand.fillStyle(0xb8943a, rng(0.3, 0.7));
      sand.fillCircle(sx, sy, rng(1, 4));
    }

    // --- GRASS BASE ---
    const grass = this.add.graphics().setDepth(-1);
    grass.fillStyle(0x2d5a27);
    grass.fillRect(sandW, sandW, W-sandW*2, H-sandW*2);

    this.popToSpawn = n;
    this.popSpawned = 0;
    this.popOnMapLimit = Math.max(1, Math.ceil(n * 0.5));
    this.waveState = 'spawning';
    document.getElementById('h-wave').textContent = 'Wave ' + this.waveNum + ' (' + n + ')';
    this.showMsg('Wave ' + this.waveNum);
    this.fillWave();
  }

  fillWave() {
    if (this.gameOver || this.waveState !== 'spawning') return;
    const alive = this.pops.getChildren().filter(p => p.alive && !p.isBossMinion).length;
    const n = Math.min(this.popOnMapLimit - alive, this.popToSpawn - this.popSpawned);
    for (let i = 0; i < n; i++) { this.popSpawned++; this.spawnPop(); }
  }

    // Scale hp and speed per wave
    const waveScale = this.waveNum - 1;
    pop.maxHp = Math.round(20 * Math.pow(1.2, waveScale)); // +20% hp per wave
    pop.hp = pop.maxHp;
    pop.speed = POP_SPEED * Math.pow(1.05, waveScale);     // +5% speed per wave
    pop.setScale(0);
    pop.play('pop-walk');
    this.pops.add(pop);
    this.tweens.add({ targets: pop, scaleX: 2, scaleY: 2, duration: 200 });
    return pop;

      const m = this.add.sprite(
        Phaser.Math.Clamp(bx + Math.cos(a) * 80, 30, ARENA_W - 30),
        Phaser.Math.Clamp(by + Math.sin(a) * 80, 30, ARENA_H - 30),
        'pop'
      ).setOrigin(0.5).setDepth(4);
      m.alive = true; m.isBossMinion = true; m.setScale(0);
      this.tweens.add({ targets: m, scaleX: 1, scaleY: 1, duration: 300, delay: i * 100 });
      this.pops.add(m);
      this.bossMinions.push(m);
    }
  }

  // ==================== COMBAT ====================

  getNearestTarget() {
    // Returns nearest alive enemy (pop or boss) within or outside radius
    let nearest = null, minD = Infinity;
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, pop.x, pop.y);
      if (d < minD) { minD = d; nearest = pop; }
    }
    if (this.boss && this.boss.alive) {
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.boss.x, this.boss.y);
      if (d < minD) { minD = d; nearest = this.boss; }
    }
    return { target: nearest, dist: minD };
  }

  getAttackDir(target) {
    if (!target) return 'down';
    const dx = target.x - this.player.x;
    const dy = target.y - this.player.y;
    if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? 'right' : 'left';
    return dy > 0 ? 'down' : 'up';
  }

  showSlashEffect(angleRad) {
    const r = ATTACK_RADIUS * ATTACK_RADIUS_MULT;
    const px = this.player.x;
    const py = this.player.y;
    const spread = Math.PI * 0.7;

    const g = this.add.graphics().setDepth(8);

    // Outer glow
    g.lineStyle(6, 0xffffff, 0.4);
    g.beginPath();
    g.arc(px, py, r + 4, angleRad - spread/2, angleRad + spread/2, false);
    g.strokePath();

    // Main slash
    g.lineStyle(3, 0xffee88, 1.0);
    g.beginPath();
    g.arc(px, py, r, angleRad - spread/2, angleRad + spread/2, false);
    g.strokePath();

    // Inner
    g.lineStyle(2, 0xffffff, 0.7);
    g.beginPath();
    g.arc(px, py, r - 8, angleRad - spread/2, angleRad + spread/2, false);
    g.strokePath();

    // Tips
    const a1 = angleRad - spread/2, a2 = angleRad + spread/2;
    g.lineStyle(2, 0xffee88, 0.9);
    g.lineBetween(px + Math.cos(a1)*(r-12), py + Math.sin(a1)*(r-12), px + Math.cos(a1)*(r+8), py + Math.sin(a1)*(r+8));
    g.lineBetween(px + Math.cos(a2)*(r-12), py + Math.sin(a2)*(r-12), px + Math.cos(a2)*(r+8), py + Math.sin(a2)*(r+8));

    this.tweens.add({ targets: g, alpha: 0, duration: 250, ease: 'Power2', onComplete: () => g.destroy() });
  }

  autoAttack() {
    if (this.gameOver || this.paused) return;

    // Find nearest target → determine attack direction
    const { target, dist } = this.getNearestTarget();
    const attackDir = this.getAttackDir(target);

    // Face toward nearest enemy (no separate attack anim — walk/idle continues)
    this.player.facing = attackDir;

    const angleRad = target
      ? Math.atan2(target.y - this.player.y, target.x - this.player.x)
      : Math.PI / 2;
    SFX.swing();
    this.showSlashEffect(angleRad);

    const minionsAlive = this.bossMinions.filter(m => m.alive);
    const bossShielded = this.boss && this.boss.alive && minionsAlive.length > 0;

    // Sector hit check: enemy must be within arc sector (angle ± spread/2) and range +10%
    const HIT_RADIUS = ATTACK_RADIUS * ATTACK_RADIUS_MULT * 1.1;
    const SPREAD = Math.PI * 0.7;
    const inSector = (ex, ey) => {
      const dx = ex - this.player.x, dy = ey - this.player.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > HIT_RADIUS) return false;
      const enemyAngle = Math.atan2(dy, dx);
      let diff = enemyAngle - angleRad;
      // Normalize diff to [-PI, PI]
      while (diff > Math.PI)  diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return Math.abs(diff) <= SPREAD / 2;
    };

    // Splash: hit ALL pops in sector
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      if (inSector(pop.x, pop.y)) this.killPop(pop);
    }

    // Boss: only damageable when all minions are dead
    if (this.boss && this.boss.alive) {
      if (inSector(this.boss.x, this.boss.y)) {
        if (bossShielded) {
          this.tweens.add({ targets: this.boss, alpha: 0.6, duration: 80, yoyo: true });
          this.showDamageNumber(this.boss.x, this.boss.y - 20, 0, '#aaaaaa');
        } else {
          const isCritBoss = this.rollCrit();
          const dmgBoss = this.rollDamage() * (isCritBoss ? 2 : 1);
          this.boss.hp -= dmgBoss;
          this.showDamageNumber(this.boss.x, this.boss.y, dmgBoss, isCritBoss ? '#ff4400' : '#ff8800');
          this.updateBossHPBar();
          this.tweens.add({ targets: this.boss, alpha: 0.4, duration: 100, yoyo: true });
          this.applyLifeSteal(dmgBoss);
          if (this.boss.hp <= 0) this.killBoss();
        }
      }
    }
  }

  showDamageNumber(x, y, amount, color) {
    color = color || '#ffffff';
    const t = this.add.text(x, y - 10, '-' + Math.round(amount), {
      fontSize: '22px', fill: color, fontFamily: 'Arial Black',
      stroke: '#000000', strokeThickness: 3
    }).setOrigin(0.5).setDepth(15);
    this.tweens.add({
      targets: t, y: y - 60, alpha: 0, duration: 900,
      ease: 'Power2',
      onComplete: () => t.destroy()
    });
  }

  applyLifeSteal(dmg) {
    const heal = dmg * this.player.stats.lifeSteal;
    if (heal <= 0) return;
    this.player.hp = Math.min(this.player.stats.maxHp, this.player.hp + heal);
    document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
    this.updateHPBar();
    // Show green number only if heal >= 3
    if (heal >= 3) {
      const t = this.add.text(this.player.x + Phaser.Math.Between(-15, 15), this.player.y - 20,
        '+' + Math.round(heal), {
          fontSize: '18px', fill: '#44ff88', fontFamily: 'Arial Black',
          stroke: '#000', strokeThickness: 2
        }).setOrigin(0.5).setDepth(15);
      this.tweens.add({ targets: t, y: t.y - 35, alpha: 0, duration: 700, ease: 'Power2', onComplete: () => t.destroy() });
    }
  }

  rollCrit() {
    return Math.random() < this.player.stats.critChance;
  }

  rollDamage() {
    // Base damage: 16–25 (random per hit), scaled by stats.damage
    const base = 16 + Math.random() * 9; // 16.0 to 25.0
    return base * this.player.stats.damage;
  }

  killPop(pop) {
    if (!pop.alive) return;
    const isCrit = this.rollCrit();
    const dmg = this.rollDamage() * (isCrit ? 2 : 1);
    pop.hp = (pop.hp || 1) - dmg;
    if (isCrit) SFX.crit(); else SFX.hit();
    this.showDamageNumber(pop.x, pop.y, dmg, isCrit ? '#ff4400' : '#ffff44');
    if (pop.hp > 0) return; // still alive

    pop.alive = false;
    SFX.popDie();
    this.killCount++;
    document.getElementById('h-kills').textContent = 'Kills: ' + this.killCount;
    this.applyLifeSteal(dmg);
    this.addXP(XP_PER_POP);
    this.tweens.add({
      targets: pop, scaleX: 0, scaleY: 0, alpha: 0, duration: 200,
      onComplete: () => {
        this.pops.remove(pop, true, true);
        if (this.waveState === 'spawning' && !pop.isBossMinion) {
          this.time.delayedCall(400, () => this.fillWave());
        }
      }
    });
  }

  killBoss() {
    this.boss.alive = false;
    this.killCount++;
    document.getElementById('h-kills').textContent = 'Kills: ' + this.killCount;
    this.destroyBossHPBar();
    this.tweens.add({
      targets: this.boss, scaleX: 0, scaleY: 0, alpha: 0, duration: 400,
      onComplete: () => { if (this.boss) { this.boss.destroy(); this.boss = null; } }
    });
    SFX.bossKill();
    this.addXP(XP_PER_BOSS);
    this.showMsg('BOSS DEFEATED!');
    this.time.delayedCall(800, () => { if (!this.gameOver) this.dropEnchant(); });
    this.time.delayedCall(1400, () => { if (!this.gameOver) this.dropRelic(); });
    this.waveState = 'intermission';
  }

  // ==================== XP / LEVEL ====================

  addXP(amount) {
    this.player.xp += amount;
    while (this.player.xp >= this.player.xpToNext) {
      this.player.xp -= this.player.xpToNext;
      this.player.level++;
      this.player.xpToNext = BASE_XP * this.player.level;
      document.getElementById('h-lvl').textContent = 'LVL ' + this.player.level;
      SFX.levelup();
      // Full heal on level up
      this.player.hp = this.player.stats.maxHp;
      document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
      this.updateHPBar();
      this.showLevelUp();
    }
    this.updateXPBar();
  }

  showLevelUp() {
    this.paused = true;
    const opts = [
      { name: 'POWER',  desc: '+20% damage',    apply: () => { this.player.stats.damage *= 1.2; } },
      { name: 'SPEED',  desc: '-15% atk cd',    apply: () => { this.player.stats.attackSpeed *= 0.85; } },
      { name: 'ARMOR',  desc: '-15% dmg taken', apply: () => { this.player.stats.defense += 1; } },
      { name: 'HEALTH', desc: '+25 max HP',      apply: () => {
        this.player.stats.maxHp += 25;
        this.player.hp = Math.min(this.player.hp + 25, this.player.stats.maxHp);
        document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
        this.updateHPBar();
      }},
      { name: 'MOVE',   desc: '+15% speed',      apply: () => { this.player.stats.moveSpeed *= 1.15; } },
      { name: 'CRIT%',     desc: '+5% crit chance (crit=x2 dmg)', apply: () => { this.player.stats.critChance = Math.min(1.0, this.player.stats.critChance + 0.05); } },
      { name: 'RANGE',     desc: '+5% attack range',  apply: () => { ATTACK_RADIUS_MULT = ATTACK_RADIUS_MULT * 1.05; } },
      { name: 'LIFESTEAL', desc: '+3% lifesteal',     apply: () => { this.player.stats.lifeSteal = Math.min(0.30, this.player.stats.lifeSteal + 0.03); } }
    ];
    const chosen = Phaser.Utils.Array.Shuffle(opts.slice()).slice(0, 3);
    const container = document.getElementById('levelup-cards');
    container.innerHTML = '';
    const scene = this;
    chosen.forEach(card => {
      const div = document.createElement('div');
      div.className = 'lcard';
      div.innerHTML = '<div class="cn">' + card.name + '</div><div class="cd">' + card.desc + '</div>';
      div.onclick = () => {
        card.apply();
        document.getElementById('levelup-overlay').style.display = 'none';
        // If relic was waiting for levelup to close — start wave now
        if (scene._relicWaitingForLevelup) {
          scene._relicWaitingForLevelup = false;
          scene.paused = false;
          scene.time.delayedCall(500, () => { if (!scene.gameOver) scene.startWave(); });
        } else {
          scene.paused = false;
        }
      };
      container.appendChild(div);
    });
    document.getElementById('levelup-overlay').style.display = 'flex';
  }

  // ==================== GEAR ====================

  dropEnchant() {
    const SLOTS = [
      { key: 'helm',   name: 'HELM',   stat: 'defense',    bonus: 0.5,  desc: '+0.5 defense' },
      { key: 'sword',  name: 'SWORD',  stat: 'damage',     bonus: 0.15, desc: '+15% damage' },
      { key: 'armor',  name: 'ARMOR',  stat: 'defense',    bonus: 0.8,  desc: '+0.8 defense' },
      { key: 'gloves', name: 'GLOVES', stat: 'attackSpeed',bonus: 0.1,  desc: '-10% attack cd' },
      { key: 'boots',  name: 'BOOTS',  stat: 'moveSpeed',  bonus: 0.1,  desc: '+10% move speed' }
    ];
    const slot = SLOTS[Phaser.Math.Between(0, 4)];
    this.player.gear[slot.key]++;
    const lvl = this.player.gear[slot.key];
    if (slot.stat === 'attackSpeed') this.player.stats.attackSpeed = Math.max(0.3, this.player.stats.attackSpeed - slot.bonus);
    else if (slot.stat === 'damage')     this.player.stats.damage    += slot.bonus;
    else if (slot.stat === 'defense')    this.player.stats.defense   += slot.bonus;
    else if (slot.stat === 'moveSpeed')  this.player.stats.moveSpeed += slot.bonus;
    this.updateGearHUD();
    this.showMsg(slot.name + ' +' + lvl, slot.desc);
  }

  dropRelic() {
    // Roll quality
    const roll = Math.random();
    let cumulative = 0;
    let qualityKey = 'common';
    for (const key of RELIC_ORDER) {
      cumulative += RELICS[key].chance;
      if (roll <= cumulative) { qualityKey = key; break; }
    }
    const quality = RELICS[qualityKey];

    // Pick random relic from this quality
    const shuffled = Phaser.Utils.Array.Shuffle(quality.items.slice());
    const pick = shuffled.find(name => !this.collectedRelics.has(name));


    if (!pick) {
      // All relics of this quality already collected
      this.showMsg('Реликвия уже в коллекции', 'Восстановлено здоровье');
      this.player.hp = this.player.stats.maxHp;
      document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
      this.updateHPBar();
      this.time.delayedCall(2800, () => { if (!this.gameOver) this.startWave(); });
      return;
    }

    SFX.relic();
    this.collectedRelics.set(pick, { quality, bonusText: '' }); // bonusText filled below

    // Apply random stat bonus
    const stat = RELIC_STATS[Phaser.Math.Between(0, RELIC_STATS.length - 1)];
    const bonusVal = quality.bonus;
    stat.apply(this.player.stats, bonusVal);
    // Format bonus display
    const pct = Math.round(bonusVal * 100);
    const bonusText = '+' + pct + '% ' + stat.label;

    this.paused = true;

    // Show relic overlay
    const card = document.getElementById('relic-card');
    card.style.background = quality.bg;
    card.style.borderColor = quality.color;
    card.style.boxShadow = '0 0 24px ' + quality.color + '88';
    document.getElementById('relic-quality').style.color = quality.color;
    document.getElementById('relic-quality').textContent = '✦ ' + quality.label + ' ✦';
    document.getElementById('relic-name').textContent = pick;
    document.getElementById('relic-name').style.textShadow = '0 0 20px ' + quality.color;
    this.collectedRelics.get(pick).bonusText = bonusText;
    document.getElementById('relic-flavor').textContent = bonusText + '  |  Реликвий: ' + this.collectedRelics.size;
    document.getElementById('relic-btn').style.color = quality.color;
    document.getElementById('relic-btn').style.borderColor = quality.color;
    document.getElementById('relic-overlay').style.display = 'flex';

    const scene = this;
    window._relicClose = () => {
      document.getElementById('relic-overlay').style.display = 'none';
      // Only unpause if levelup overlay is also closed
      const levelupOpen = document.getElementById('levelup-overlay').style.display === 'flex';
      if (!levelupOpen) {
        scene.paused = false;
        scene.time.delayedCall(500, () => { if (!scene.gameOver) scene.startWave(); });
      } else {
        // levelup will start wave when closed
        scene._relicWaitingForLevelup = true;
      }
    };
  }

  updateGearHUD() {
    const MAP = { helm: 'g-helm', sword: 'g-sword', armor: 'g-armor', gloves: 'g-gloves', boots: 'g-boots' };
    const LBL = { helm: 'HLM', sword: 'SWD', armor: 'ARM', gloves: 'GLV', boots: 'BOT' };
    for (const [key, id] of Object.entries(MAP)) {
      const el = document.getElementById(id);
      if (!el) continue;
      const lvl = this.player.gear[key] || 0;
      el.textContent = LBL[key] + (lvl > 0 ? '+' + lvl : '');
      el.className = 'gear-slot' + (lvl > 0 ? ' active' : '');
    }
  }

  // ==================== HUD (HTML DOM) ====================

  createHUD() {
    // All HUD is HTML — nothing to create in Phaser
  }

  updateHPBar() {
    const pct = Math.max(0, Math.min(1, this.player.hp / this.player.stats.maxHp));
    const el = document.getElementById('hp-fill');
    if (el) {
      el.style.width = (pct * 100) + '%';
      el.style.background = pct > 0.6 ? '#44ff44' : pct > 0.3 ? '#ffaa00' : '#ff3333';
    }
  }

  updateXPBar() {
    const pct = Math.min(1, this.player.xp / this.player.xpToNext);
    const el = document.getElementById('xp-fill');
    if (el) el.style.width = (pct * 100) + '%';
  }

  // ==================== BOSS HP BAR (HTML) ====================

  createBossHPBar() {
    document.getElementById('boss-bar').style.display = 'block';
    document.getElementById('boss-fill').style.width = '100%';
  }

  updateBossHPBar() {
    if (!this.boss) return;
    const pct = Math.max(0, this.boss.hp / this.boss.maxHp);
    document.getElementById('boss-fill').style.width = (pct * 100) + '%';
  }

  destroyBossHPBar() {
    document.getElementById('boss-bar').style.display = 'none';
  }

  // ==================== MESSAGES (HTML) ====================

  showMsg(text, sub) {
    const el = document.getElementById('msg');
    const elSub = document.getElementById('msg-sub');
    if (!el) return;
    el.textContent = text;
    el.style.opacity = '1';
    if (elSub) {
      elSub.textContent = sub || '';
      elSub.style.opacity = sub ? '1' : '0';
    }
    clearTimeout(this._msgTimer);
    this._msgTimer = setTimeout(() => {
      el.style.opacity = '0';
      if (elSub) elSub.style.opacity = '0';
    }, 2500);
  }

  // ==================== GAME OVER (HTML) ====================

  showGameOver() {
    this.gameOver = true;
    AMBIENT.stop();
    const KEYS = ['helm','sword','armor','gloves','boots'];
    const LBL  = ['HLM','SWD','ARM','GLV','BOT'];
    const gs = KEYS.map((k,i) => { const l = this.player.gear[k]||0; return LBL[i]+(l>0?'+'+l:''); }).join('  ');
    // Stats line
    document.getElementById('go-stats').textContent =
      'Kills: ' + this.killCount + '  ·  Wave: ' + this.waveNum + '  ·  Level: ' + this.player.level;

    // Gear line
    const gearEl = document.getElementById('go-gear');
    gearEl.innerHTML = KEYS.map((k,i) => {
      const l = this.player.gear[k] || 0;
      const txt = LBL[i] + (l > 0 ? '+' + l : '');
      return '<span class="' + (l > 0 ? '' : 'dim') + '">' + txt + '</span>';
    }).join(' ');

    // Relics
    const relicsWrap = document.getElementById('go-relics-wrap');
    const relicsEl   = document.getElementById('go-relics');
    const relicsTitleEl = document.getElementById('go-relics-title');
    if (this.collectedRelics.size > 0) {
      relicsWrap.style.display = 'block';
      relicsTitleEl.textContent = 'Реликвии (' + this.collectedRelics.size + ')';
      relicsEl.innerHTML = [...this.collectedRelics.entries()].map(([name, data]) => {
        const color = (data.quality && data.quality.color) || '#aaa';
        return '<div class="go-relic-name" style="color:' + color + '">' + name + '</div>';
      }).join('');
    } else {
      relicsWrap.style.display = 'none';
    }

    // Setup name input with generated name
    const genName = generateName();
    document.getElementById('player-name-input').value = genName;
    document.getElementById('save-score-block').style.display = 'block';
    document.getElementById('save-result').textContent = '';

    const score = calcScore(this.waveNum, this.killCount, this.player.level, this.collectedRelics.size);
    const scene = this;

    window._saveScore = async () => {
      const name = document.getElementById('player-name-input').value.trim() || genName;
      document.getElementById('save-btn').disabled = true;
      document.getElementById('save-result').textContent = 'Saving...';
      try {
        const res = await sbFetch('/rest/v1/leaderboard', {
          method: 'POST',
          headers: { 'Prefer': 'return=minimal' },
          body: JSON.stringify({ name, score, wave: scene.waveNum, kills: scene.killCount, level: scene.player.level, relics_count: scene.collectedRelics.size })
        });
        if (res.ok) {
          document.getElementById('save-result').textContent = '✅ Saved! Opening leaderboard...';
          document.getElementById('save-score-block').style.display = 'none';
          setTimeout(() => window._openLeaderboard(name), 800);
        } else {
          document.getElementById('save-result').textContent = '❌ Error saving';
          document.getElementById('save-btn').disabled = false;
        }
      } catch(e) {
        document.getElementById('save-result').textContent = '❌ Network error';
        document.getElementById('save-btn').disabled = false;
      }
    };

    document.getElementById('gameover-overlay').style.display = 'flex';

    // Share handler
    const relicLines = [...this.collectedRelics.entries()].map(([name, data]) =>
      '  ' + (data.quality ? '[' + data.quality.label + '] ' : '') + name + ' (' + data.bonusText + ')'
    ).join('\n');
    const shareText = '⚔️ Poporing Island\n'
      + '🌊 Волна: ' + this.waveNum + '\n'
      + '💀 Убийств: ' + this.killCount + '\n'
      + '⭐ Уровень: ' + this.player.level + '\n'
      + (this.collectedRelics.size > 0 ? '✦ Реликвии (' + this.collectedRelics.size + '):\n' + relicLines + '\n' : '')
      + '🔗 https://dotochkapi.github.io/poporinq-island/';

    window._shareResult = async () => {
      if (navigator.share) {
        try {
          await navigator.share({ title: 'Poporing Island', text: shareText });
        } catch(e) {}
      } else {
        await navigator.clipboard.writeText(shareText);
        document.getElementById('share-btn').textContent = '[ СКОПИРОВАНО! ]';
        setTimeout(() => { document.getElementById('share-btn').textContent = '[ SHARE ]'; }, 2000);
      }
    };
  }

  // ==================== JOYSTICK ====================

  joyDown(p) {
    if (!this.joy.active) {
      this.joy = { active: true, startX: p.x, startY: p.y, dx: 0, dy: 0, pid: p.id };
      this.joyBase.clear();
      this.joyBase.lineStyle(2, 0xffffff, 0.3); this.joyBase.fillStyle(0xffffff, 0.1);
      this.joyBase.fillCircle(p.x, p.y, 50); this.joyBase.strokeCircle(p.x, p.y, 50);
      this.joyKnob.clear(); this.joyKnob.fillStyle(0xffffff, 0.4); this.joyKnob.fillCircle(p.x, p.y, 22);
    }
  }

  joyMove(p) {
    if (!this.joy.active || p.id !== this.joy.pid) return;
    const dx = p.x - this.joy.startX, dy = p.y - this.joy.startY;
    const len = Math.sqrt(dx*dx + dy*dy), r = 50;
    if (len > 0) { this.joy.dx = (dx/len)*Math.min(len,r)/r; this.joy.dy = (dy/len)*Math.min(len,r)/r; }
    const cx = this.joy.startX + this.joy.dx * r, cy = this.joy.startY + this.joy.dy * r;
    this.joyKnob.clear(); this.joyKnob.fillStyle(0xffffff, 0.4); this.joyKnob.fillCircle(cx, cy, 22);
  }

  joyUp(p) {
    if (p.id !== this.joy.pid) return;
    this.joy.active = false; this.joy.dx = 0; this.joy.dy = 0;
    this.joyBase.clear(); this.joyKnob.clear();
  }

  // ==================== UPDATE ====================

  update(time, delta) {
    if (this.gameOver || this.paused) return;
    const dt = delta / 1000;

    // Movement
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown  || this.wasd.left.isDown)  vx = -1;
    else if (this.cursors.right.isDown || this.wasd.right.isDown) vx = 1;
    if (this.cursors.up.isDown    || this.wasd.up.isDown)    vy = -1;
    else if (this.cursors.down.isDown  || this.wasd.down.isDown)  vy = 1;
    if (this.joy.active) { vx = this.joy.dx; vy = this.joy.dy; }
    if (vx && vy) { vx *= 0.707; vy *= 0.707; }
    const spd = PLAYER_SPEED * this.player.stats.moveSpeed;
    this.player.x = Phaser.Math.Clamp(this.player.x + vx * spd * dt, 16, ARENA_W - 16);
    this.player.y = Phaser.Math.Clamp(this.player.y + vy * spd * dt, 16, ARENA_H - 16);

    // Knight walk animation
    if (true) {
      if (vx !== 0 || vy !== 0) {
        let dir = 'down';
        if (Math.abs(vy) >= Math.abs(vx)) { dir = vy > 0 ? 'down' : 'up'; }
        else { dir = vx > 0 ? 'right' : 'left'; }
        if (dir !== this.player.facing || !this.player.anims.isPlaying) {
          this.player.facing = dir;
          this.player.play('knight-walk-' + dir, true);
        }
      } else {
        const idle = 'knight-idle-' + (this.player.facing || 'down');
        if (!this.player.anims.currentAnim || this.player.anims.currentAnim.key !== idle) {
          this.player.play(idle, true);
        }
      }
    }

    // Wave end check
    if (this.waveState === 'spawning' &&
        this.popSpawned >= this.popToSpawn &&
        this.pops.getChildren().filter(p => p.alive && !p.isBossMinion).length === 0) {
      this.waveState = 'boss';
      this.time.delayedCall(1000, () => { if (!this.gameOver) this.spawnBoss(); });
    }

    // Pop movement & damage
    for (const pop of this.pops.getChildren()) {
      if (!pop.alive) continue;
      const dx = this.player.x - pop.x, dy = this.player.y - pop.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 18) {
        pop.x += (dx/dist) * (pop.speed || POP_SPEED) * dt;
        pop.y += (dy/dist) * (pop.speed || POP_SPEED) * dt;
        if (pop.anims.currentAnim && pop.anims.currentAnim.key !== 'pop-walk') pop.play('pop-walk', true);
      } else {
        if (pop.anims.currentAnim && pop.anims.currentAnim.key !== 'pop-attack') pop.play('pop-attack', true);
        const last = this.player.lastDamageTime.get(pop) || 0;
        if (time - last > POP_DAMAGE_COOLDOWN) {
          this.player.lastDamageTime.set(pop, time);
          const dmg = POP_DAMAGE * Math.max(0.1, 1 - this.player.stats.defense * 0.15);
          SFX.hurt();
          this.player.hp = Math.max(0, this.player.hp - dmg);
          document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
          this.updateHPBar();
          this.tweens.add({ targets: this.player, alpha: 0.3, duration: 100, yoyo: true });
          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
    }

    // Boss movement & damage
    if (this.boss && this.boss.alive) {
      const dx = this.player.x - this.boss.x, dy = this.player.y - this.boss.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 48) {
        this.boss.x += (dx/dist) * 50 * dt;
        this.boss.y += (dy/dist) * 50 * dt;
        if (this.boss.anims.currentAnim && this.boss.anims.currentAnim.key !== 'boss-walk') this.boss.play('boss-walk', true);
      } else {
        if (this.boss.anims.currentAnim && this.boss.anims.currentAnim.key !== 'boss-attack') this.boss.play('boss-attack', true);
        const last = this.player.lastDamageTime.get(this.boss) || 0;
        if (time - last > 800) {
          this.player.lastDamageTime.set(this.boss, time);
          const dmg = 20 * Math.max(0.1, 1 - this.player.stats.defense * 0.15);
          this.player.hp = Math.max(0, this.player.hp - dmg);
          document.getElementById('h-hp').textContent = 'HP: ' + Math.floor(this.player.hp);
          this.updateHPBar();
          this.tweens.add({ targets: this.player, alpha: 0.2, duration: 150, yoyo: true });
          if (this.player.hp <= 0) { this.showGameOver(); return; }
        }
      }
      // Minions orbit boss
      const alive = this.bossMinions.filter(m => m.alive);
      alive.forEach((m, i) => {
        const a = (i / alive.length) * Math.PI * 2 + time * 0.001;
        m.x = this.boss.x + Math.cos(a) * 70;
        m.y = this.boss.y + Math.sin(a) * 70;
      });
    }
  }
}

const config = {
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#0a1a0a',
  scene: GameScene,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH }
};

new Phaser.Game(config);
</script>
</body>
